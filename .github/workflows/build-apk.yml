              void translateLiveText(String source) {
                  long now=System.currentTimeMillis();
                  if(!translatorReady || liveTranslator==null || translatingText.get() || now-lastTranslationAt<1400 || source.equals(lastLiveSource)) return;
                  if(!translatingText.compareAndSet(false,true)) return;
                  lastTranslationAt=now; lastLiveSource=source;
                  liveTranslator.translate(source)
                      .addOnSuccessListener(translated->updateOverlay(source+"\n\nالعربية:\n"+translated))
                      .addOnFailureListener(e->updateOverlay("تعذرت ترجمة النص: "+e.getClass().getSimpleName()+"\n"+source))
                      .addOnCompleteListener(task->translatingText.set(false));
              }
              String normalizeOcr(String raw) {
                  return raw.toLowerCase(Locale.ROOT).replaceAll("[^a-z]","");
              }
              String detectedResource(String raw) {
                  String s=normalizeOcr(raw);
                  String[][] resources={
                      {"sweet flower","sweetflower"},{"mint","mint"},{"matsutake","matsutake"},{"sunsettia","sunsettia"},
                      {"berry","berry"},{"valberry","valberry"},{"windwheel aster","windwheelaster"},{"cecilia","cecilia"},
                      {"wolfhook","wolfhook"},{"qingxin","qingxin"},{"silk flower","silkflower"},{"cor lapis","corlapis"},
                      {"noctilucous jade","noctilucousjade"},{"crystal chunk","crystalchunk"},{"white iron chunk","whiteironchunk"},
                      {"amethyst lump","amethystlump"},{"iron chunk","ironchunk"},{"scarab","scarab"},{"onikabuto","onikabuto"},
                      {"sakura bloom","sakurabloom"},{"dandelion seed","dandelionseed"},{"lotus head","lotushead"},
                      {"jueyun chili","jueyunchili"},{"philanemo mushroom","philanemomushroom"},{"pinecone","pinecone"},
                      {"bird egg","birdegg"},{"fowl","fowl"},{"fish","fish"},{"crab","crab"},{"frog","frog"},
                      {"lizard tail","lizardtail"},{"common chest","commonchest"},{"exquisite chest","exquisitechest"},
                      {"precious chest","preciouschest"},{"luxurious chest","luxuriouschest"},{"remarkable chest","remarkablechest"}
                  };
                  for(String[] item:resources) if(s.contains(item[1])) return item[0];
                  return null;
              }
              String resourceIcon(String item) {
                  if(item.contains("chest")) return "📦";
                  if(item.contains("ore") || item.contains("crystal") || item.contains("jade") || item.contains("amethyst")) return "💎";
                  if(item.contains("fish") || item.contains("crab") || item.contains("frog")) return "🐟";
                  if(item.contains("flower") || item.contains("aster") || item.contains("cecilia") || item.contains("qingxin")) return "🌸";
                  return "🌿";
              }
              void updateResourceMarkers(List<Text.Line> lines) {
                  if(overlayManager==null) return;
                  if(!resourceMarkersEnabled) { clearResourceMarkers(); return; }
                  HashSet<String> visible=new HashSet<>();
                  for(Text.Line line:lines) {
                      String item=detectedResource(line.getText());
                      Rect bounds=line.getBoundingBox();
                      if(item==null || bounds==null) continue;
                      visible.add(item);
                      TextView marker=resourceMarkers.get(item);
                      if(marker==null) {
                          marker=new TextView(this);
                          marker.setText("▼\n"+resourceIcon(item)+" "+item);
                          marker.setGravity(Gravity.CENTER);
                          marker.setTextColor(Color.WHITE); marker.setTextSize(12);
                          marker.setPadding(dp(9),dp(5),dp(9),dp(5));
                          GradientDrawable bg=new GradientDrawable();
                          bg.setColor(0xE620684B); bg.setCornerRadius(dp(10));
                          bg.setStroke(dp(1),0xFFFFD98A);
                          marker.setBackground(bg);
                          int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                          WindowManager.LayoutParams p=new WindowManager.LayoutParams(-2,-2,type,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE|WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT);
                          p.gravity=Gravity.TOP|Gravity.LEFT;
                          p.x=Math.max(0,bounds.centerX()-dp(72));
                          p.y=Math.max(0,bounds.top-dp(54));
                          try { overlayManager.addView(marker,p); resourceMarkers.put(item,marker); } catch(Exception ignored) {}
                      } else {
                          try {
                              WindowManager.LayoutParams p=(WindowManager.LayoutParams)marker.getLayoutParams();
                              p.x=Math.max(0,bounds.centerX()-dp(72));
                              p.y=Math.max(0,bounds.top-dp(54));
                              overlayManager.updateViewLayout(marker,p);
                          } catch(Exception ignored) {}
                      }
                  }
                  Iterator<Map.Entry<String,TextView>> it=resourceMarkers.entrySet().iterator();
                  while(it.hasNext()) {
                      Map.Entry<String,TextView> entry=it.next();
                      if(!visible.contains(entry.getKey())) {
                          try { overlayManager.removeView(entry.getValue()); } catch(Exception ignored) {}
                          it.remove();
                      }
                  }
              }
              void updateOverlay(String value) {
                  runOnUiThread(()->{if(overlayText!=null) overlayText.setText(value);});
              }
              void showAchievementList() {
                  try {
                      JSONArray items=new JSONArray(prefs.getString("achievement_lines","[]"));
                      int done=0;
                      for(int i=0;i<items.length();i++) if(prefs.getBoolean(achievementKey(items.optString(i)),false)) done++;
                      line("العناصر التي تعرّف عليها التطبيق: "+items.length());
                      line("التي علّمتها كمكتملة: "+done+" من "+items.length());
                      ProgressBar progress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                      progress.setMax(Math.max(1,items.length())); progress.setProgress(done);
                      content.addView(progress,new LinearLayout.LayoutParams(-1,24));
                      for(int i=0;i<items.length();i++) {
                          String name=items.optString(i);
                          CheckBox item=new CheckBox(this); item.setText(name); item.setTextSize(14);
                          item.setChecked(prefs.getBoolean(achievementKey(name),false));
                          item.setOnCheckedChangeListener((button,checked)->prefs.edit().putBoolean(achievementKey(name),checked).apply());
                          content.addView(item);
                      }
                      if(items.length()==0) line("لا توجد إنجازات مقروءة بعد. ابدأ المسح المباشر وانتقل إلى صفحات الإنجازات داخل اللعبة.");
                  } catch(Exception e) { line("تعذر عرض القائمة: "+e.getMessage()); }
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode==REQUEST_SCREEN_CAPTURE) {
                      if(resultCode==RESULT_OK && data!=null) {
                          if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: تم منح الإذن، جارٍ تشغيل المحرك...");
                          try {
                              startProjectionForegroundService(resultCode,data);
                          } catch(Exception e) {
                              String message=e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage());
                              if(liveScanStatus!=null) liveScanStatus.setText("فشل تشغيل خدمة مشاركة الشاشة: "+message);
                              Toast.makeText(this,"فشل تشغيل خدمة مشاركة الشاشة: "+message,Toast.LENGTH_LONG).show();
                              stopProjectionForegroundService();
                          }
                      } else {
                          if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: لم تتم الموافقة على مشاركة الشاشة.");
                          Toast.makeText(this,"لم يتم منح إذن مشاركة الشاشة.",Toast.LENGTH_LONG).show();
                      }
                      return;
                  }
                  if(requestCode!=PICK_ACHIEVEMENT_IMAGE || resultCode!=RESULT_OK || data==null || data.getData()==null) return;
                  Uri uri=data.getData();
                  content.removeAllViews(); heading("قراءة الصورة...");
                  line("يجري استخراج النصوص من الصورة على جهازك.");
                  try {
                      InputImage image=InputImage.fromFilePath(this,uri);
                      TextRecognizer recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      recognizer.process(image)
                          .addOnSuccessListener(result->{
                              try {
                                  LinkedHashSet<String> names=new LinkedHashSet<>();
                                  JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                                  for(int i=0;i<old.length();i++) names.add(old.optString(i));
                                  for(Text.TextBlock block:result.getTextBlocks()) {
                                      for(Text.Line textLine:block.getLines()) {
                                          String value=textLine.getText().trim().replaceAll("\\s+"," ");
                                          boolean hasLetter=value.codePoints().anyMatch(Character::isLetter);
                                          if(value.length()>=3 && hasLetter) names.add(value);
                                      }
                                  }
                                  JSONArray merged=new JSONArray();
                                  for(String name:names) merged.put(name);
                                  prefs.edit().putString("achievement_lines",merged.toString()).apply();
                                  recognizer.close();
                                  content.removeAllViews(); heading("اكتملت قراءة الصورة");
                                  line("أضيفت النصوص المكتشفة. راجع القائمة وحدد الإنجازات المكتملة بنفسك؛ قد يلتقط OCR عناوين أو نصوصاً إضافية.");
                                  showAchievementList();
                              } catch(Exception e) {
                                  recognizer.close(); content.removeAllViews(); heading("تعذرت معالجة النص");
                                  line(e.getMessage());
                              }
                          })
                          .addOnFailureListener(error->{
                              recognizer.close(); content.removeAllViews(); heading("فشلت قراءة الصورة");
                              line("جرّب صورة أوضح، مع تكبير النص وتقليل الانعكاس.");
                              line(error.getMessage());
                          });
                  } catch(Exception e) {
                      content.removeAllViews(); heading("تعذر فتح الصورة"); line(e.getMessage());
                  }
              }
              void testOverlayWindow() {
                  if(!hasOverlayPermission()) {
                      Toast.makeText(this,"إذن الظهور فوق التطبيقات غير مفعّل.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  WindowManager wm=(WindowManager)getSystemService(WINDOW_SERVICE);
                  TextView test=new TextView(this);
                  test.setText("✓ اختبار النافذة العائمة\nإذا كنت ترى هذه الرسالة فالإذن يعمل.");
                  test.setTextColor(Color.WHITE); test.setTextSize(16); test.setGravity(Gravity.CENTER);
                  test.setPadding(dp(18),dp(16),dp(18),dp(16));
                  GradientDrawable bg=new GradientDrawable();
                  bg.setColor(0xEE203B68); bg.setCornerRadius(dp(16)); bg.setStroke(dp(2),0xFFFFD98A);
                  test.setBackground(bg);
                  int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                  WindowManager.LayoutParams p=new WindowManager.LayoutParams(dp(280),-2,type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT);
                  p.gravity=Gravity.CENTER;
                  try {
                      wm.addView(test,p);
                      Toast.makeText(this,"تم إنشاء نافذة الاختبار لمدة 6 ثوانٍ.",Toast.LENGTH_SHORT).show();
                      new Handler(Looper.getMainLooper()).postDelayed(()->{
                          try { wm.removeView(test); } catch(Exception ignored) {}
                      },6000);
                  } catch(Exception e) {
                      Toast.makeText(this,"فشل اختبار النافذة: "+e.getClass().getSimpleName()+" — "+e.getMessage(),Toast.LENGTH_LONG).show();
                  }
              }
              void showTecnoCompatibilityHelp() {
                  new android.app.AlertDialog.Builder(this)
                      .setTitle("إعدادات TECNO / HiOS")
                      .setMessage("للسماح للمساعد بالعمل فوق Genshin Impact:\\n1) افتح معلومات تطبيق Genshin Assistant ثم الأذونات الخاصة وفعّل الظهور فوق التطبيقات.\\n2) من إعدادات البطارية اجعل التطبيق بلا قيود أو اختر عدم التحسين.\\n3) فعّل التشغيل التلقائي والسماح بالنوافذ المنبثقة في الخلفية إن ظهرت هذه الخيارات في HiOS.\\n4) أعد فتح المساعد وابدأ المسح من جديد.\\nقد تختلف أسماء القوائم حسب إصدار HiOS.")
                      .setNegativeButton("إغلاق",null)
                      .setPositiveButton("فتح معلومات التطبيق",(d,w)->{
                          try { startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,Uri.parse("package:"+getPackageName()))); }
                          catch(Exception e) { Toast.makeText(this,"تعذر فتح معلومات التطبيق.",Toast.LENGTH_LONG).show(); }
                      }).show();
              }
              void startLiveScan() {
                  if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: تم الضغط على زر البدء، جارٍ فحص الأذونات...");
                  Toast.makeText(this,"جارٍ تجهيز المسح المباشر...",Toast.LENGTH_SHORT).show();
                  try {
                  if(Build.VERSION.SDK_INT>=23 && !Settings.canDrawOverlays(this)) {
                      if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: إذن الظهور فوق التطبيقات غير مفعّل.");
                      new android.app.AlertDialog.Builder(this)
                          .setTitle("السماح بالنافذة العائمة")
                          .setMessage("لإظهار الترجمة العربية فوق اللعبة، اسمح للتطبيق بالظهور فوق التطبيقات الأخرى، ثم ارجع واضغط بدء المسح مرة أخرى.")
                          .setNegativeButton("لاحقاً",null)
                          .setPositiveButton("فتح الإعدادات",(d,w)->{
                              Intent settings=new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+getPackageName()));
                              checkingOverlayPermission=true;
                              startActivity(settings);
                          }).show();
                      return;
                  }
                  requestScreenCapturePermission();
                  } catch(Exception e) {
                      String message=e.getClass().getSimpleName()+": "+e.getMessage();
                      if(liveScanStatus!=null) liveScanStatus.setText("تعذر بدء المسح: "+message);
                      Toast.makeText(this,"تعذر بدء المسح: "+message,Toast.LENGTH_LONG).show();
                  }
              }
              void requestScreenCapturePermission() {
                  MediaProjectionManager manager=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);
                  if(manager==null) throw new IllegalStateException("خدمة مشاركة الشاشة غير متاحة على الجهاز");
                  Intent captureIntent=manager.createScreenCaptureIntent();
                  if(captureIntent==null) throw new IllegalStateException("تعذر إنشاء طلب مشاركة الشاشة");
                  if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: افتح نافذة أندرويد واختر بدء الآن للسماح بمشاركة الشاشة.");
                  startActivityForResult(captureIntent,REQUEST_SCREEN_CAPTURE);
              }
              void startProjectionForegroundService(int resultCode,Intent data) {
                  pendingProjectionResultCode=resultCode;
                  pendingProjectionData=data;
                  Intent serviceIntent=new Intent(this,ProjectionCaptureService.class);
                  if(Build.VERSION.SDK_INT>=26) startForegroundService(serviceIntent); else startService(serviceIntent);
                  boolean bound=bindService(serviceIntent,projectionServiceConnection,BIND_AUTO_CREATE);
                  if(!bound){
                      pendingProjectionData=null;
                      stopService(serviceIntent);
                      throw new IllegalStateException("تعذر الاتصال بخدمة المسح الأمامية");
                  }
                  if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: تشغيل خدمة مشاركة الشاشة...");
              }
              void stopProjectionForegroundService() {
                  if(projectionServiceBound){
                      try{unbindService(projectionServiceConnection);}catch(Exception ignored){}
                      projectionServiceBound=false;
                  }
                  try{stopService(new Intent(this,ProjectionCaptureService.class));}catch(Exception ignored){}
                  pendingProjectionData=null;
              }
              void beginLiveScan(int resultCode,Intent data) {
                  try {
                      MediaProjectionManager manager=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);
                      mediaProjection=manager.getMediaProjection(resultCode,data);
                      WindowManager wm=(WindowManager)getSystemService(WINDOW_SERVICE);
                      DisplayMetrics metrics=new DisplayMetrics(); wm.getDefaultDisplay().getRealMetrics(metrics);
                      int width=metrics.widthPixels,height=metrics.heightPixels,density=metrics.densityDpi;
                      imageReader=ImageReader.newInstance(width,height,PixelFormat.RGBA_8888,3);
                      liveRecognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      setupTranslationOverlay();
                      mediaProjection.registerCallback(new MediaProjection.Callback(){@Override public void onStop(){runOnUiThread(()->releaseCapture());}},new Handler(Looper.getMainLooper()));
                      virtualDisplay=mediaProjection.createVirtualDisplay("GenshinAchievementReader",width,height,density,DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,imageReader.getSurface(),null,null);
                      imageReader.setOnImageAvailableListener(reader->{
                          if(!processingFrame.compareAndSet(false,true)){Image skip=reader.acquireLatestImage();if(skip!=null)skip.close();return;}
                          Image frame=reader.acquireLatestImage();
                          if(frame==null){processingFrame.set(false);return;}
                          try {
                              InputImage input=InputImage.fromMediaImage(frame,0);
                              liveRecognizer.process(input).addOnSuccessListener(result->{
                                  LinkedHashSet<String> found=new LinkedHashSet<>();
                                  ArrayList<String> orderedLines=new ArrayList<>();
                                  StringBuilder screenText=new StringBuilder();
                                  ArrayList<Text.Line> detectedLines=new ArrayList<>();
                                  for(Text.TextBlock block:result.getTextBlocks()) for(Text.Line textLine:block.getLines()) {
                                      detectedLines.add(textLine);
                                      String value=textLine.getText().trim().replaceAll("\\s+"," ");
                                      if(value.length()>=3 && value.codePoints().anyMatch(Character::isLetter)) {
                                          found.add(value); orderedLines.add(value);
                                          if(screenText.length()<650) screenText.append(value).append('\n');
                                      }
                                  }
                                  ocrFrameCount++;
                                  lastOcrLineCount=orderedLines.size();
                                  updateResourceMarkers(detectedLines);
                                  boolean achievementPage=isAchievementPage(orderedLines);
                                  if(achievementPage) {
                                      saveLiveNames(found);
                                      markCompletedFromOcr(orderedLines);
                                  }
                                  long now=System.currentTimeMillis();
                                  if(liveScanStatus!=null && now-lastOcrUiUpdate>2500) {
                                      lastOcrUiUpdate=now;
                                      liveScanStatus.setText("حالة المسح: يقرأ الشاشة ✓ | إطارات: "+ocrFrameCount+" | أسطر مقروءة: "+lastOcrLineCount+" | صفحة الإنجازات: "+(achievementPage?"نعم":"لا"));
                                  }
                                  if(screenText.length()>0) translateLiveText(screenText.toString().trim());
                                  else if(translatorReady && overlayText!=null) updateOverlay("المسح يعمل، لكن لم أتعرف على نص في هذه اللقطة. تأكد أن نص اللعبة ظاهر وواضح.");
                              }).addOnFailureListener(error->{
                                  android.util.Log.e("GenshinAssistant","Live OCR failed",error);
                                  updateOverlay("تعذرت قراءة نص الشاشة: "+error.getClass().getSimpleName());
                              }).addOnCompleteListener(task->{frame.close();processingFrame.set(false);});
                          } catch(Exception e){frame.close();processingFrame.set(false);}
                      },new Handler(Looper.getMainLooper()));
                      ocrFrameCount=0; lastOcrLineCount=0; lastOcrUiUpdate=0;
                      if(liveScanStatus!=null) liveScanStatus.setText("حالة المسح: يعمل الآن؛ أنتظر أول إطار من الشاشة...");
                      Toast.makeText(this,"بدأ المسح. انتقل إلى اللعبة ومرّر صفحات الإنجازات.",Toast.LENGTH_LONG).show();
                  } catch(Exception e){
                      String message=e.getClass().getSimpleName()+": "+e.getMessage();
                      if(liveScanStatus!=null) liveScanStatus.setText("فشل تشغيل المسح: "+message);
                      Toast.makeText(this,"تعذر بدء المسح: "+message,Toast.LENGTH_LONG).show();
                      releaseCapture();
                  }
              }
              void saveLiveNames(Set<String> found) {
                  try {
                      LinkedHashSet<String> merged=new LinkedHashSet<>();
                      JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                      for(int i=0;i<old.length();i++)merged.add(old.optString(i));
                      merged.addAll(found);
                      JSONArray arr=new JSONArray();for(String s:merged)arr.put(s);
                      prefs.edit().putString("achievement_lines",arr.toString()).apply();
                  }catch(Exception ignored){}
              }
              void stopLiveScan() {
                  if(mediaProjection!=null){try{mediaProjection.stop();}catch(Exception ignored){}}
                  releaseCapture();content.removeAllViews();heading("نتائج المسح المباشر");showAchievementList();
              }
              void releaseCapture() {
                  if(virtualDisplay!=null){virtualDisplay.release();virtualDisplay=null;}
                  if(imageReader!=null){imageReader.close();imageReader=null;}
                  if(liveRecognizer!=null){liveRecognizer.close();liveRecognizer=null;}
                  if(liveTranslator!=null){liveTranslator.close();liveTranslator=null;}
                  translatorReady=false; translatingText.set(false);
                  if(overlayText!=null && overlayManager!=null){try{overlayManager.removeView(overlayText);}catch(Exception ignored){}}
                  overlayText=null;
                  if(floatingMenu!=null && overlayManager!=null) { try { overlayManager.removeView(floatingMenu); } catch(Exception ignored) {} }
                  floatingMenu=null; floatingMenuItems=null; floatingMenuParams=null;
                  if(overlayManager!=null) {
                      for(TextView marker:resourceMarkers.values()) { try { overlayManager.removeView(marker); } catch(Exception ignored) {} }
                  }
                  resourceMarkers.clear(); overlayManager=null;
                  mediaProjection=null;
                  stopProjectionForegroundService();
              }
              @Override protected void onDestroy(){if(mediaProjection!=null){try{mediaProjection.stop();}catch(Exception ignored){}}releaseCapture();super.onDestroy();}
              void showTasks() {
                  content.removeAllViews();heading("المهام العامة");
                  line("مهام يمكنك التأشير عليها بعد إنجازها.");
                  check("daily_commissions","إنجاز المهام اليومية");check("daily_resin","استخدام الراتنج الأصلي");
                  check("weekly_boss","إنجاز زعماء الأسبوع");check("domains","إنجاز الزنزانات");
                  check("exploration","استكشاف المناطق");check("waypoints","فتح نقاط الانتقال");
                  check("local_specialties","جمع الموارد المحلية");check("enemy_drops","جمع مواد الوحوش");
                  line("تبقى العلامات محفوظة حتى تغيّرها بنفسك.");
              }
          }


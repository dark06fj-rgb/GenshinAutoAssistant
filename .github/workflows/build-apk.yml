
name: Build Genshin Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/genshinassistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GenshinAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.genshinassistant'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.genshinassistant'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Genshin Assistant"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/genshinassistant/MainActivity.java <<'EOF'
          package com.example.genshinassistant;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;
          import android.content.SharedPreferences;

          public class MainActivity extends Activity {
              LinearLayout content;
              SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("progress", MODE_PRIVATE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 24, 20, 20);
                  root.setBackgroundColor(Color.rgb(245, 245, 250));

                  TextView title = new TextView(this);
                  title.setText("Genshin Assistant");
                  title.setTextSize(26);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  LinearLayout menu = new LinearLayout(this);
                  menu.setOrientation(LinearLayout.VERTICAL);

                  addButton(menu, "الشخصيات", () -> showCharacters());
                  addButton(menu, "التفريم", () -> showFarming());
                  addButton(menu, "تقدم الحساب", () -> showProgress());

                  root.addView(menu);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(8, 20, 8, 20);
                  scroll.addView(content);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      -1, 0, 1
                  ));

                  setContentView(root);
                  showHome();
              }

              void addButton(LinearLayout parent, String label, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(17);
                  b.setOnClickListener(v -> action.run());
                  parent.addView(b);
              }

              void heading(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(21);
                  t.setTypeface(null, Typeface.BOLD);
                  t.setPadding(8, 12, 8, 12);
                  content.addView(t);
              }

              void line(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(16);
                  t.setPadding(8, 8, 8, 8);
                  content.addView(t);
              }

              void check(String key, String label) {
                  CheckBox c = new CheckBox(this);
                  c.setText(label);
                  c.setTextSize(16);
                  c.setChecked(prefs.getBoolean(key, false));
                  c.setOnCheckedChangeListener((v, checked) ->
                      prefs.edit().putBoolean(key, checked).apply()
                  );
                  content.addView(c);
              }

              void showHome() {
                  content.removeAllViews();
                  heading("مرحباً بك!");
                  line("مساعد مستقل لتنظيم تقدمك في Genshin Impact.");
                  line("اختر أحد الأقسام من الأزرار أعلاه.");
                  line("هذا التطبيق لا يتحكم باللعبة ولا يعدّل ملفاتها.");
              }

              void showCharacters() {
                  content.removeAllViews();
                  heading("الشخصيات");
                  line("قائمة متابعة تطوير شخصياتك:");
                  check("char1", "رفع مستوى الشخصية");
                  check("char2", "جمع مواد الصعود");
                  check("char3", "تطوير المواهب");
                  check("char4", "تحسين القطع الأثرية");
                  check("char5", "تطوير السلاح");
              }

              void showFarming() {
                  content.removeAllViews();
                  heading("التفريم");
                  line("قائمة مهام جمع الموارد اليومية:");
                  check("farm1", "جمع الزهور والموارد المحلية");
                  check("farm2", "جمع مواد الوحوش");
                  check("farm3", "جمع خامات تطوير الأسلحة");
                  check("farm4", "إنجاز الزنزانات");
                  check("farm5", "استخدام الراتنج الأصلي");
                  line("حدد المهام التي أنجزتها لتُحفظ تلقائياً.");
              }

              void showProgress() {
                  content.removeAllViews();
                  heading("تقدم الحساب");
                  line("تابع إنجازاتك:");
                  check("prog1", "إنجاز المهام اليومية");
                  check("prog2", "استكشاف المناطق");
                  check("prog3", "فتح نقاط الانتقال");
                  check("prog4", "تطوير الشخصيات");
                  check("prog5", "جمع الأسلحة والموارد");
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genshin-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

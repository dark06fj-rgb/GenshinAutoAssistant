                  // Attach dragging only to the title; a listener on the whole header
                  // consumes taps before the collapse button can receive its click.
                  title.setOnTouchListener(new android.view.View.OnTouchListener(){
                      float downX,downY; int startX,startY;
                      @Override public boolean onTouch(android.view.View view,android.view.MotionEvent event) {
                          if(floatingMenuParams==null || overlayManager==null) return false;
                          if(event.getAction()==android.view.MotionEvent.ACTION_DOWN) {
                              downX=event.getRawX(); downY=event.getRawY();
                              startX=floatingMenuParams.x; startY=floatingMenuParams.y;
                              return true;
                          }
                          if(event.getAction()==android.view.MotionEvent.ACTION_MOVE) {
                              floatingMenuParams.x=Math.max(0,startX+(int)(downX-event.getRawX()));
                              floatingMenuParams.y=Math.max(0,startY+(int)(event.getRawY()-downY));
                              try { overlayManager.updateViewLayout(floatingMenu,floatingMenuParams); } catch(Exception ignored) {}
                              return true;
                          }
                          return event.getAction()==android.view.MotionEvent.ACTION_UP
                              || event.getAction()==android.view.MotionEvent.ACTION_CANCEL;
                      }
                  });
                  try {
                      if(floatingMenu.getParent()==null) overlayManager.addView(floatingMenu,floatingMenuParams);

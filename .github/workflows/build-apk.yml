          cat > app/src/main/java/com/example/genshinassistant/ProjectionCaptureService.java <<'EOF'
          package com.example.genshinassistant;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.widget.Toast;

          public class ProjectionCaptureService extends Service {
              static final String CHANNEL_ID="genshin_screen_capture";
              final android.os.Binder binder=new LocalBinder();
              class LocalBinder extends android.os.Binder {
                  ProjectionCaptureService getService(){return ProjectionCaptureService.this;}
              }
              @Override public void onCreate(){
                  super.onCreate();
                  if(Build.VERSION.SDK_INT>=26){
                      NotificationChannel channel=new NotificationChannel(CHANNEL_ID,"مشاركة الشاشة",NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("تشغيل المسح المباشر للشاشة أثناء استخدام المساعد");
                      NotificationManager manager=getSystemService(NotificationManager.class);
                      if(manager!=null) manager.createNotificationChannel(channel);
                  }
              }
              @Override public int onStartCommand(Intent intent,int flags,int startId){
                  Notification notification;
                  if(Build.VERSION.SDK_INT>=26){
                      notification=new Notification.Builder(this,CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setContentTitle("Genshin Assistant")
                          .setContentText("المسح المباشر للشاشة يعمل")
                          .setOngoing(true)
                          .build();
                  }else{
                      notification=new Notification.Builder(this)
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setContentTitle("Genshin Assistant")
                          .setContentText("المسح المباشر للشاشة يعمل")
                          .setOngoing(true)
                          .build();
                  }
                  try {
                      if(Build.VERSION.SDK_INT>=29){
                          startForeground(1001,notification,ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      }else{
                          startForeground(1001,notification);
                      }
                  } catch(Exception e) {
                      String message=e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage());
                      android.util.Log.e("GenshinAssistant","Projection foreground service failed",e);
                      Toast.makeText(this,"تعذر تشغيل خدمة مشاركة الشاشة: "+message,Toast.LENGTH_LONG).show();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }
              @Override public IBinder onBind(Intent intent){return binder;}
          }

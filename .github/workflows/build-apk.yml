
name: Build Genshin Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/genshinassistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GenshinAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.genshinassistant'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.genshinassistant'
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName '5.0'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="Genshin Assistant"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/genshinassistant/MainActivity.java <<'EOF'
          package com.example.genshinassistant;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.*;
          import android.content.SharedPreferences;
          import java.util.*;
          import java.net.*;
          import java.io.*;
          import org.json.*;
          import android.content.Intent;
          import android.net.Uri;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          
          public class MainActivity extends Activity {
              static final int PICK_ACHIEVEMENT_IMAGE=501;
              LinearLayout root, content, nav;
              SharedPreferences prefs;
              final String[] characters = {"Aino","Albedo","Alhaitham","Amber","Arlecchino","Barbara","Bennett","Chasca","Furina","Ganyu","Hu Tao","Kaedehara Kazuha","Kamisato Ayaka","Kamisato Ayato","Keqing","Klee","Nahida","Neuvillette","Raiden Shogun","Xiangling","Xingqiu","Yelan","Zhongli"};
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs=getSharedPreferences("genshin_progress",MODE_PRIVATE);
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16,18,16,12); root.setBackgroundColor(Color.rgb(247,246,250));
                  TextView title=new TextView(this); title.setText("Genshin Assistant"); title.setTextSize(25);
                  title.setTypeface(null,Typeface.BOLD); title.setTextColor(Color.rgb(65,48,91));
                  title.setGravity(Gravity.CENTER); title.setPadding(4,8,4,14); root.addView(title);
                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(2,4,2,18); scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  nav=new LinearLayout(this); nav.setOrientation(LinearLayout.HORIZONTAL); nav.setGravity(Gravity.CENTER);
                  addNav("الرئيسية",()->showHome()); addNav("الشخصيات",()->showCharacters()); addNav("المهام",()->showTasks()); addNav("الإنجازات",()->showAchievements());
                  root.addView(nav); setContentView(root); showHome();
              }
              void addNav(String label,Runnable action) {
                  Button b=new Button(this); b.setText(label); b.setTextSize(12); b.setOnClickListener(v->action.run());
                  nav.addView(b,new LinearLayout.LayoutParams(0,-2,1));
              }
              void heading(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(21); t.setTypeface(null,Typeface.BOLD);
                  t.setTextColor(Color.rgb(65,48,91)); t.setPadding(4,12,4,10); content.addView(t);
              }
              void line(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(15); t.setTextColor(Color.DKGRAY);
                  t.setPadding(4,5,4,8); content.addView(t);
              }
              void check(String key,String label) {
                  CheckBox c=new CheckBox(this); c.setText(label); c.setTextSize(15); c.setPadding(4,5,4,5);
                  c.setChecked(prefs.getBoolean(key,false));
                  c.setOnCheckedChangeListener((v,checked)->prefs.edit().putBoolean(key,checked).apply());
                  content.addView(c);
              }
              String key(String prefix,String name) {
                  return prefix+"_"+name.toLowerCase(Locale.ROOT).replace(" ","_");
              }
              void showHome() {
                  content.removeAllViews(); heading("أهلاً بك في رحلتك في تيفات!");
                  line("تابع شخصياتك ومواد التطوير والمهام من مكان واحد.");
                  int owned=0,done=0,total=0;
                  for(String n:characters) {
                      if(prefs.getBoolean(key("owned",n),false)) owned++;
                      for(int i=1;i<=5;i++){total++;if(prefs.getBoolean(key("task"+i,n),false))done++;}
                  }
                  line("الشخصيات التي تملكها: "+owned+" من "+characters.length);
                  line("مهام تطوير الشخصيات المنجزة: "+done+" من "+total);
                  ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(Math.max(1,total));bar.setProgress(done);content.addView(bar,new LinearLayout.LayoutParams(-1,24));
                  Button b=new Button(this);b.setText("افتح قائمة الشخصيات");b.setOnClickListener(v->showCharacters());content.addView(b);
                  Button connect=new Button(this); connect.setText("ربط حساب Genshin عبر UID"); connect.setOnClickListener(v->connectAccount()); content.addView(connect);
                  line("يمكن جلب بيانات المعرض العام عبر UID دون كلمة مرور أو ملفات اللعبة.");
                  Button achievements=new Button(this); achievements.setText("سجل الإنجازات"); achievements.setOnClickListener(v->showAchievements()); content.addView(achievements);
              }
              void connectAccount() {
                  LinearLayout form=new LinearLayout(this); form.setOrientation(LinearLayout.VERTICAL);
                  EditText uidInput=new EditText(this); uidInput.setSingleLine(true); uidInput.setInputType(2);
                  uidInput.setHint("أدخل UID الخاص بك (9 أرقام)"); 
                  String saved=prefs.getString("game_uid","");
                  if(!saved.isEmpty()) uidInput.setText(saved);
                  form.addView(uidInput);
                  new android.app.AlertDialog.Builder(this).setTitle("ربط حساب Genshin")
                      .setMessage("يجب تفعيل Show Character Details في ملفك داخل اللعبة حتى يمكن قراءة شخصيات المعرض. لا تدخل كلمة المرور أو ملفات تعريف الارتباط.")
                      .setView(form)
                      .setNegativeButton("إلغاء",null)
                      .setPositiveButton("اتصال", (dialog,which)->{
                          String uid=uidInput.getText().toString().trim();
                          if(!uid.matches("\\d{9,11}")) { new android.app.AlertDialog.Builder(this).setMessage("UID غير صحيح. أدخل من 9 إلى 11 رقماً.").setPositiveButton("حسناً",null).show(); return; }
                          prefs.edit().putString("game_uid",uid).apply();
                          content.removeAllViews(); heading("جارٍ الاتصال...");
                          line("نقرأ بيانات المعرض العام فقط. قد يستغرق ذلك بضع ثوانٍ.");
                          new Thread(()->{
                              try {
                                  URL url=new URL("https://enka.network/api/uid/"+uid+"/");
                                  HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                                  conn.setRequestMethod("GET"); conn.setConnectTimeout(15000); conn.setReadTimeout(15000);
                                  conn.setRequestProperty("User-Agent","GenshinAssistant/4.0 (Android)");
                                  int code=conn.getResponseCode();
                                  if(code!=200) throw new Exception("HTTP "+code);
                                  BufferedReader reader=new BufferedReader(new InputStreamReader(conn.getInputStream(),"UTF-8"));
                                  StringBuilder body=new StringBuilder(); String line;
                                  while((line=reader.readLine())!=null) body.append(line);
                                  reader.close(); conn.disconnect();
                                  JSONObject data=new JSONObject(body.toString());
                                  JSONObject player=data.optJSONObject("playerInfo");
                                  if(player==null) throw new Exception("لم يتم العثور على بيانات اللاعب.");
                                  JSONArray avatars=data.optJSONArray("avatarInfoList");
                                  int count=avatars==null?0:avatars.length();
                                  String nickname=player.optString("nickname","لا يوجد اسم");
                                  int world=player.optInt("worldLevel",-1);
                                  int achievements=player.optInt("finishAchievementNum",-1);
                                  runOnUiThread(()->{
                                      content.removeAllViews(); heading("تم الاتصال بالحساب!");
                                      line("UID: "+uid); line("اسم اللاعب: "+nickname);
                                      if(world>=0) line("مستوى العالم: "+world);
                                      if(achievements>=0) line("الإنجازات: "+achievements);
                                      line("الشخصيات الظاهرة في المعرض: "+count);
                                      if(count==0) line("لم تظهر شخصيات. فعّل Show Character Details في ملفك داخل اللعبة ثم أعد المحاولة.");
                                      else {
                                          line("معرّفات الشخصيات الظاهرة:");
                                          for(int i=0;i<count;i++) {
                                              JSONObject av=avatars.optJSONObject(i);
                                              if(av!=null) line("• "+av.optInt("avatarId",0));
                                          }
                                      }
                                      line("المصدر: Enka.Network — بيانات المعرض التي جعلتها عامة فقط.");
                                      Button back=new Button(this); back.setText("العودة للرئيسية"); back.setOnClickListener(v->showHome()); content.addView(back);
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(()->{
                                      content.removeAllViews(); heading("تعذر الاتصال");
                                      line("تحقق من UID واتصال الإنترنت وإعدادات عرض الشخصيات في اللعبة.");
                                      line("تفاصيل الخطأ: "+e.getMessage());
                                      Button retry=new Button(this); retry.setText("إعادة المحاولة"); retry.setOnClickListener(v->connectAccount()); content.addView(retry);
                                      Button back=new Button(this); back.setText("الرئيسية"); back.setOnClickListener(v->showHome()); content.addView(back);
                                  });
                              }
                          }).start();
                      }).show();
              }
              void showCharacters() {
                  content.removeAllViews();heading("قائمة الشخصيات");
                  line("ضع علامة على الشخصيات التي تملكها، واضغط على اسمها لمتابعة تطويرها.");
                  EditText search=new EditText(this);search.setSingleLine(true);search.setTextSize(15);
                  search.setHint("ابحث عن شخصية...");content.addView(search);
                  LinearLayout list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);content.addView(list);
                  Runnable refresh=()->{
                      list.removeAllViews();String q=search.getText().toString().toLowerCase(Locale.ROOT).trim();
                      for(String name:characters){
                          if(!name.toLowerCase(Locale.ROOT).contains(q))continue;
                          LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);
                          CheckBox owned=new CheckBox(this);owned.setText("أملكها");owned.setTextSize(12);
                          owned.setChecked(prefs.getBoolean(key("owned",name),false));
                          owned.setOnCheckedChangeListener((v,checked)->prefs.edit().putBoolean(key("owned",name),checked).apply());
                          row.addView(owned);
                          Button details=new Button(this);details.setText(name);details.setAllCaps(false);
                          details.setOnClickListener(v->showCharacterDetails(name));
                          row.addView(details,new LinearLayout.LayoutParams(0,-2,1));list.addView(row);
                      }
                  };
                  search.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int before,int count){refresh.run();}
                      public void afterTextChanged(Editable e){}
                  });refresh.run();
              }
              void showCharacterDetails(String name) {
                  content.removeAllViews();Button back=new Button(this);back.setText("رجوع إلى الشخصيات");
                  back.setOnClickListener(v->showCharacters());content.addView(back);heading(name);
                  line("علّم على ما أنجزته؛ سيُحفظ التقدم تلقائياً.");
                  check(key("task1",name),"رفع المستوى");check(key("task2",name),"جمع مواد الصعود");
                  check(key("task3",name),"تطوير المواهب");check(key("task4",name),"تحسين القطع الأثرية");
                  check(key("task5",name),"تطوير السلاح");
                  int done=0;for(int i=1;i<=5;i++)if(prefs.getBoolean(key("task"+i,name),false))done++;
                  line("إنجاز تطوير الشخصية: "+(done*20)+"٪");
                  ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(5);bar.setProgress(done);content.addView(bar,new LinearLayout.LayoutParams(-1,24));
              }
          void showAchievements() {
                  content.removeAllViews(); heading("سجل الإنجازات");
                  line("استورد صور صفحات الإنجازات من اللعبة. يمكنك استيراد عدة صور، وستُدمج الأسماء المكتشفة في قائمة واحدة.");
                  Button pick=new Button(this); pick.setText("اختيار صورة إنجازات"); pick.setOnClickListener(v->{
                      Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.setType("image/*"); intent.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(intent,PICK_ACHIEVEMENT_IMAGE);
                  }); content.addView(pick);
                  showAchievementList();
              }
              String achievementKey(String name) {
                  return "achievement_done_"+Integer.toHexString(name.toLowerCase(Locale.ROOT).trim().hashCode());
              }
              void showAchievementList() {
                  try {
                      JSONArray items=new JSONArray(prefs.getString("achievement_lines","[]"));
                      int done=0;
                      for(int i=0;i<items.length();i++) if(prefs.getBoolean(achievementKey(items.optString(i)),false)) done++;
                      line("العناصر التي تعرّف عليها التطبيق: "+items.length());
                      line("التي علّمتها كمكتملة: "+done+" من "+items.length());
                      ProgressBar progress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                      progress.setMax(Math.max(1,items.length())); progress.setProgress(done);
                      content.addView(progress,new LinearLayout.LayoutParams(-1,24));
                      for(int i=0;i<items.length();i++) {
                          String name=items.optString(i);
                          CheckBox item=new CheckBox(this); item.setText(name); item.setTextSize(14);
                          item.setChecked(prefs.getBoolean(achievementKey(name),false));
                          item.setOnCheckedChangeListener((button,checked)->prefs.edit().putBoolean(achievementKey(name),checked).apply());
                          content.addView(item);
                      }
                      if(items.length()==0) line("لا توجد إنجازات مستوردة بعد. افتح صفحة الإنجازات في اللعبة والتقط صورة واضحة لها.");
                  } catch(Exception e) { line("تعذر عرض القائمة: "+e.getMessage()); }
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode!=PICK_ACHIEVEMENT_IMAGE || resultCode!=RESULT_OK || data==null || data.getData()==null) return;
                  Uri uri=data.getData();
                  content.removeAllViews(); heading("قراءة الصورة...");
                  line("يجري استخراج النصوص من الصورة على جهازك.");
                  try {
                      InputImage image=InputImage.fromFilePath(this,uri);
                      TextRecognizer recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      recognizer.process(image)
                          .addOnSuccessListener(result->{
                              try {
                                  LinkedHashSet<String> names=new LinkedHashSet<>();
                                  JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                                  for(int i=0;i<old.length();i++) names.add(old.optString(i));
                                  for(Text.TextBlock block:result.getTextBlocks()) {
                                      for(Text.Line textLine:block.getLines()) {
                                          String value=textLine.getText().trim().replaceAll("\\s+"," ");
                                          boolean hasLetter=value.codePoints().anyMatch(Character::isLetter);
                                          if(value.length()>=3 && hasLetter) names.add(value);
                                      }
                                  }
                                  JSONArray merged=new JSONArray();
                                  for(String name:names) merged.put(name);
                                  prefs.edit().putString("achievement_lines",merged.toString()).apply();
                                  recognizer.close();
                                  content.removeAllViews(); heading("اكتملت قراءة الصورة");
                                  line("أضيفت النصوص المكتشفة. راجع القائمة وحدد الإنجازات المكتملة بنفسك؛ قد يلتقط OCR عناوين أو نصوصاً إضافية.");
                                  showAchievementList();
                              } catch(Exception e) {
                                  recognizer.close(); content.removeAllViews(); heading("تعذرت معالجة النص");
                                  line(e.getMessage());
                              }
                          })
                          .addOnFailureListener(error->{
                              recognizer.close(); content.removeAllViews(); heading("فشلت قراءة الصورة");
                              line("جرّب صورة أوضح، مع تكبير النص وتقليل الانعكاس.");
                              line(error.getMessage());
                          });
                  } catch(Exception e) {
                      content.removeAllViews(); heading("تعذر فتح الصورة"); line(e.getMessage());
                  }
              }
              void showTasks() {
                  content.removeAllViews();heading("المهام العامة");
                  line("مهام يمكنك التأشير عليها بعد إنجازها.");
                  check("daily_commissions","إنجاز المهام اليومية");check("daily_resin","استخدام الراتنج الأصلي");
                  check("weekly_boss","إنجاز زعماء الأسبوع");check("domains","إنجاز الزنزانات");
                  check("exploration","استكشاف المناطق");check("waypoints","فتح نقاط الانتقال");
                  check("local_specialties","جمع الموارد المحلية");check("enemy_drops","جمع مواد الوحوش");
                  line("تبقى العلامات محفوظة حتى تغيّرها بنفسك.");
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genshin-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

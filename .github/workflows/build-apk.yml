
name: Build Genshin Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/resource-detector-test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/genshinassistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GenshinAssistant"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.genshinassistant'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.genshinassistant'
                  minSdk 23
                  targetSdk 33
                  versionCode 19
                  versionName '6.7'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          EOF

          mkdir -p app/src/main/res/drawable
          
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101B3A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#243E78" android:pathData="M0,78L30,38L52,68L75,24L108,70V108H0z"/>
              <path android:fillColor="#315A9A" android:pathData="M0,91L27,57L49,79L76,45L108,84V108H0z"/>
              <path android:fillColor="#FFD98A" android:pathData="M54,10 L61,39 L90,54 L61,61 L54,90 L47,61 L18,54 L47,39z"/>
              <path android:fillColor="#7FD7FF" android:pathData="M54,25 L60,48 L83,54 L60,60 L54,83 L48,60 L25,54 L48,48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,39 L58,50 L69,54 L58,58 L54,69 L50,58 L39,54 L50,50z"/>
              <path android:fillColor="#E8C47B" android:pathData="M9,9h90v3h-90zM9,96h90v3h-90z"/>
          </vector>
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <queries>
                  <package android:name="com.miHoYo.GenshinImpact"/>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="Genshin Assistant"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <service
                      android:name=".ProjectionCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/genshinassistant/MainActivity.java <<'EOF'
          package com.example.genshinassistant;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.*;
          import android.content.SharedPreferences;
          import java.util.*;
          import java.net.*;
          import java.io.*;
          import org.json.*;
          import android.content.Intent;
          import android.content.ComponentName;
          import android.content.ServiceConnection;
          import android.os.IBinder;
          import android.app.Service;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.pm.ServiceInfo;
          import android.net.Uri;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.hardware.display.VirtualDisplay;
          import android.hardware.display.DisplayManager;
          import android.media.Image;
          import android.media.ImageReader;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import android.provider.Settings;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import com.google.mlkit.nl.translate.Translation;
          import com.google.mlkit.nl.translate.Translator;
          import com.google.mlkit.nl.translate.TranslatorOptions;
          import com.google.mlkit.nl.translate.TranslateLanguage;
          import com.google.mlkit.common.model.DownloadConditions;
          import android.os.Handler;
          import android.os.Looper;
          import java.util.concurrent.atomic.AtomicBoolean;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          
          public class MainActivity extends Activity {
              static final int PICK_ACHIEVEMENT_IMAGE=501;
              static final int REQUEST_SCREEN_CAPTURE=502;
              MediaProjection mediaProjection;
              int pendingProjectionResultCode;
              Intent pendingProjectionData;
              boolean projectionServiceBound=false;
              final ServiceConnection projectionServiceConnection=new ServiceConnection(){
                  @Override public void onServiceConnected(ComponentName name,IBinder binder){
                      projectionServiceBound=true;
                      if(pendingProjectionData!=null){
                          Intent data=pendingProjectionData; int code=pendingProjectionResultCode;
                          pendingProjectionData=null;
                          beginLiveScan(code,data);
                      }
                  }
                  @Override public void onServiceDisconnected(ComponentName name){projectionServiceBound=false;}
              };
              VirtualDisplay virtualDisplay;
              WindowManager overlayManager;
              TextView overlayText;
              LinearLayout floatingMenu, floatingMenuItems;
              WindowManager.LayoutParams floatingMenuParams;
              boolean resourceMarkersEnabled=true, translationVisible=true;
              boolean checkingOverlayPermission=false;
              TextView overlayPermissionStatus, liveScanStatus;
              Translator liveTranslator;
              boolean translatorReady=false;
              final AtomicBoolean translatingText=new AtomicBoolean(false);
              long lastTranslationAt=0;
              String lastLiveSource="";
              ImageReader imageReader;
              TextRecognizer liveRecognizer;
              final AtomicBoolean processingFrame=new AtomicBoolean(false);
              int ocrFrameCount=0;
              int lastOcrLineCount=0;
              long lastOcrUiUpdate=0;
              final LinkedHashSet<String> liveNames=new LinkedHashSet<>();
              final LinkedHashMap<String,TextView> resourceMarkers=new LinkedHashMap<>();
              LinearLayout root, content, nav;
              SharedPreferences prefs;
              final String[] characters = {"Aino","Albedo","Alhaitham","Amber","Arlecchino","Barbara","Bennett","Chasca","Furina","Ganyu","Hu Tao","Kaedehara Kazuha","Kamisato Ayaka","Kamisato Ayato","Keqing","Klee","Nahida","Neuvillette","Raiden Shogun","Xiangling","Xingqiu","Yelan","Zhongli"};
          
              @Override protected void onResume() {
                  super.onResume();
                  if(checkingOverlayPermission) {
                      checkingOverlayPermission=false;
                      boolean enabled=hasOverlayPermission();
                      updateOverlayPermissionStatus();
                      Toast.makeText(this,enabled?"تم التأكد: إذن النوافذ العائمة مفعّل ✓":"الإذن غير مفعّل بعد. لن تظهر النوافذ العائمة حتى تسمح به.",Toast.LENGTH_LONG).show();
                  }
              }
              boolean hasOverlayPermission() { return Build.VERSION.SDK_INT<23 || Settings.canDrawOverlays(this); }
              void updateOverlayPermissionStatus() {
                  if(overlayPermissionStatus!=null) overlayPermissionStatus.setText("إذن النوافذ العائمة: "+(hasOverlayPermission()?"مفعّل ✓":"غير مفعّل ✕"));
              }
              static boolean crashHandlerInstalled=false;
              void installCrashDiagnostics() {
                  if(crashHandlerInstalled) return;
                  crashHandlerInstalled=true;
                  Thread.UncaughtExceptionHandler previous=Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((thread,error)->{
                      try {
                          java.io.StringWriter writer=new java.io.StringWriter();
                          error.printStackTrace(new java.io.PrintWriter(writer));
                          getSharedPreferences("genshin_progress",MODE_PRIVATE).edit()
                              .putString("last_scan_crash",writer.toString()).commit();
                      } catch(Exception ignored) {}
                      if(previous!=null) previous.uncaughtException(thread,error);
                      else android.os.Process.killProcess(android.os.Process.myPid());
                  });
              }
              void showPreviousCrashIfAny() {
                  String report=prefs.getString("last_scan_crash","");
                  if(report==null || report.length()==0) return;
                  prefs.edit().remove("last_scan_crash").apply();
                  String shown=report.length()>7000?report.substring(0,7000):report;
                  new AlertDialog.Builder(this)
                      .setTitle("تشخيص توقف التطبيق")
                      .setMessage("هذا هو سبب الإغلاق السابق. أرسل لي النص، خصوصاً السطر الذي يبدأ بـ Caused by أو اسم الخطأ:\n\n"+shown)
                      .setPositiveButton("حسناً",null)
                      .show();
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  installCrashDiagnostics();
                  prefs=getSharedPreferences("genshin_progress",MODE_PRIVATE);
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16,18,16,12); root.setBackgroundColor(Color.rgb(247,246,250));
                  TextView title=new TextView(this); title.setText("Genshin Assistant"); title.setTextSize(25);
                  title.setTypeface(null,Typeface.BOLD); title.setTextColor(Color.rgb(65,48,91));
                  title.setGravity(Gravity.CENTER); title.setPadding(4,8,4,14); root.addView(title);
                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(2,4,2,18); scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  nav=new LinearLayout(this); nav.setOrientation(LinearLayout.HORIZONTAL); nav.setGravity(Gravity.CENTER);
                  addNav("الرئيسية",()->showHome()); addNav("الشخصيات",()->showCharacters()); addNav("المهام",()->showTasks()); addNav("الإنجازات",()->showAchievements());
                  root.addView(nav); setContentView(root); showHome();
                  showPreviousCrashIfAny();
              }
              void addNav(String label,Runnable action) {
                  Button b=new Button(this); b.setText(label); b.setTextSize(12); b.setOnClickListener(v->action.run());
                  nav.addView(b,new LinearLayout.LayoutParams(0,-2,1));
              }
              void heading(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(21); t.setTypeface(null,Typeface.BOLD);
                  t.setTextColor(Color.rgb(65,48,91)); t.setPadding(4,12,4,10); content.addView(t);
              }
              void line(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(15); t.setTextColor(Color.DKGRAY);
                  t.setPadding(4,5,4,8); content.addView(t);
              }
              void check(String key,String label) {
                  CheckBox c=new CheckBox(this); c.setText(label); c.setTextSize(15); c.setPadding(4,5,4,5);
                  c.setChecked(prefs.getBoolean(key,false));
                  c.setOnCheckedChangeListener((v,checked)->prefs.edit().putBoolean(key,checked).apply());
                  content.addView(c);
              }
              String key(String prefix,String name) {
                  return prefix+"_"+name.toLowerCase(Locale.ROOT).replace(" ","_");
              }
              int dp(float value) { return (int)(value*getResources().getDisplayMetrics().density+0.5f); }
              class GenshinFrame extends android.view.View {
                  final android.graphics.Paint paint=new android.graphics.Paint(3);
                  GenshinFrame(android.content.Context context) { super(context); }
                  void star(android.graphics.Canvas canvas,float x,float y,float radius) {
                      android.graphics.Path path=new android.graphics.Path();
                      path.moveTo(x,y-radius); path.lineTo(x+radius*.25f,y-radius*.25f);
                      path.lineTo(x+radius,y); path.lineTo(x+radius*.25f,y+radius*.25f);                      path.lineTo(x,y+radius); path.lineTo(x-radius*.25f,y+radius*.25f);
                      path.lineTo(x-radius,y); path.lineTo(x-radius*.25f,y-radius*.25f); path.close();
                      paint.setColor(0xFFFFD98A); paint.setStyle(android.graphics.Paint.Style.FILL); canvas.drawPath(path,paint);
                  }
                  @Override protected void onDraw(android.graphics.Canvas canvas) {
                      super.onDraw(canvas);
                      float w=getWidth(),h=getHeight();
                      paint.setShader(new android.graphics.LinearGradient(0,0,0,h,new int[]{0xFF102B66,0xFF367DC0,0xFFB5D9F1},null,android.graphics.Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(new android.graphics.RectF(2,2,w-2,h-2),dp(18),dp(18),paint); paint.setShader(null);
                      paint.setStyle(android.graphics.Paint.Style.FILL);
                      paint.setColor(0xFFFFE8A3); canvas.drawCircle(w*.82f,h*.22f,dp(17),paint);
                      paint.setColor(0xFF6EA5D4); canvas.drawCircle(w*.85f,h*.18f,dp(16),paint);
                      for(int k=0;k<18;k++){float x=(k*73%997)/997f*w;float y=(k*37%311)/311f*h;paint.setColor(0xCCFFFFFF);canvas.drawCircle(x,y,dp(1.2f),paint);}
                      paint.setColor(0xFF314B83); android.graphics.Path far=new android.graphics.Path();far.moveTo(0,h*.72f);far.lineTo(w*.18f,h*.36f);far.lineTo(w*.32f,h*.68f);far.lineTo(w*.52f,h*.29f);far.lineTo(w*.75f,h*.7f);far.lineTo(w*.9f,h*.4f);far.lineTo(w,h*.62f);far.lineTo(w,h);far.lineTo(0,h);far.close();canvas.drawPath(far,paint);
                      paint.setColor(0xFF182D58); android.graphics.Path near=new android.graphics.Path();near.moveTo(0,h*.82f);near.lineTo(w*.2f,h*.58f);near.lineTo(w*.4f,h*.83f);near.lineTo(w*.63f,h*.55f);near.lineTo(w*.82f,h*.8f);near.lineTo(w,h*.58f);near.lineTo(w,h);near.lineTo(0,h);near.close();canvas.drawPath(near,paint);
                      paint.setColor(0xFFFFD98A);canvas.drawRect(w*.61f,h*.39f,w*.64f,h*.72f,paint);canvas.drawRect(w*.68f,h*.34f,w*.71f,h*.72f,paint);canvas.drawRect(w*.75f,h*.43f,w*.78f,h*.72f,paint);
                      canvas.drawRect(w*.595f,h*.36f,w*.655f,h*.4f,paint);canvas.drawRect(w*.665f,h*.31f,w*.725f,h*.35f,paint);canvas.drawRect(w*.735f,h*.4f,w*.795f,h*.44f,paint);
                      paint.setColor(0xFF0C1B43);canvas.drawRect(0,h*.82f,w,h,paint);
                      paint.setStyle(android.graphics.Paint.Style.STROKE);paint.setStrokeWidth(dp(2));paint.setColor(0xFFFFD98A);canvas.drawRoundRect(new android.graphics.RectF(dp(5),dp(5),w-dp(5),h-dp(5)),dp(16),dp(16),paint);paint.setStyle(android.graphics.Paint.Style.FILL);
                      star(canvas,w*.12f,h*.22f,dp(8));star(canvas,w*.9f,h*.2f,dp(7));
                      paint.setTextAlign(android.graphics.Paint.Align.CENTER);paint.setTypeface(Typeface.create("serif",Typeface.BOLD));paint.setColor(Color.WHITE);paint.setTextSize(dp(20));canvas.drawText("GENSHIN ASSISTANT",w/2,h*.48f,paint);
                      paint.setTypeface(Typeface.DEFAULT_BOLD);paint.setColor(0xFFFFD98A);paint.setTextSize(dp(12));canvas.drawText("رحلتك في تيفات تبدأ هنا",w/2,h*.62f,paint);
                  }
              }
              void showHome() {
                  content.removeAllViews();
                  content.addView(new GenshinFrame(this),new LinearLayout.LayoutParams(-1,dp(180)));
                  heading("أهلاً بك في رحلتك في تيفات!");
                  line("تابع شخصياتك ومواد التطوير والمهام من مكان واحد.");
                  int owned=0,done=0,total=0;
                  for(String n:characters) {
                      if(prefs.getBoolean(key("owned",n),false)) owned++;
                      for(int i=1;i<=5;i++){total++;if(prefs.getBoolean(key("task"+i,n),false))done++;}
                  }
                  line("الشخصيات التي تملكها: "+owned+" من "+characters.length);
                  line("مهام تطوير الشخصيات المنجزة: "+done+" من "+total);
                  ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(Math.max(1,total));bar.setProgress(done);content.addView(bar,new LinearLayout.LayoutParams(-1,24));
                  Button launch=new Button(this); launch.setText("▶ تشغيل Genshin Impact"); launch.setTextSize(17); launch.setOnClickListener(v->launchGenshin()); content.addView(launch,new LinearLayout.LayoutParams(-1,dp(54)));
                  Button b=new Button(this);b.setText("افتح قائمة الشخصيات");b.setOnClickListener(v->showCharacters());content.addView(b);
                  Button connect=new Button(this); connect.setText("ربط حساب Genshin عبر UID"); connect.setOnClickListener(v->connectAccount()); content.addView(connect);
                  line("يمكن جلب بيانات المعرض العام عبر UID دون كلمة مرور أو ملفات اللعبة.");
                  Button achievements=new Button(this); achievements.setText("سجل الإنجازات"); achievements.setOnClickListener(v->showAchievements()); content.addView(achievements);
              }
              void launchGenshin() {
                  final String packageName="com.miHoYo.GenshinImpact";
                  try {
                      Intent launchIntent=getPackageManager().getLaunchIntentForPackage(packageName);
                      if(launchIntent!=null) {
                          launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(launchIntent);
                      } else {
                          new android.app.AlertDialog.Builder(this)
                              .setTitle("اللعبة غير موجودة")
                              .setMessage("لم أجد Genshin Impact مثبتة على هذا الجهاز. هل تريد فتح صفحة اللعبة في Google Play؟")
                              .setNegativeButton("إلغاء",null)
                              .setPositiveButton("فتح المتجر",(dialog,which)->{
                                  try { startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("market://details?id="+packageName))); }
                                  catch(Exception e) { startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://play.google.com/store/apps/details?id="+packageName))); }
                              }).show();
                      }
                  } catch(Exception e) {
                      Toast.makeText(this,"تعذر فتح اللعبة: "+e.getMessage(),Toast.LENGTH_LONG).show();
                  }
              }
              void connectAccount() {
                  LinearLayout form=new LinearLayout(this); form.setOrientation(LinearLayout.VERTICAL);
                  EditText uidInput=new EditText(this); uidInput.setSingleLine(true); uidInput.setInputType(2);
                  uidInput.setHint("أدخل UID الخاص بك (9 أرقام)"); 
                  String saved=prefs.getString("game_uid","");
                  if(!saved.isEmpty()) uidInput.setText(saved);
                  form.addView(uidInput);
                  new android.app.AlertDialog.Builder(this).setTitle("ربط حساب Genshin")
                      .setMessage("يجب تفعيل Show Character Details في ملفك داخل اللعبة حتى يمكن قراءة شخصيات المعرض. لا تدخل كلمة المرور أو ملفات تعريف الارتباط.")
                      .setView(form)
                      .setNegativeButton("إلغاء",null)
                      .setPositiveButton("اتصال", (dialog,which)->{
                          String uid=uidInput.getText().toString().trim();
                          if(!uid.matches("\\d{9,11}")) { new android.app.AlertDialog.Builder(this).setMessage("UID غير صحيح. أدخل من 9 إلى 11 رقماً.").setPositiveButton("حسناً",null).show(); return; }
                          prefs.edit().putString("game_uid",uid).apply();
                          content.removeAllViews(); heading("جارٍ الاتصال...");
                          line("نقرأ بيانات المعرض العام فقط. قد يستغرق ذلك بضع ثوانٍ.");
                          new Thread(()->{
                              try {
                                  URL url=new URL("https://enka.network/api/uid/"+uid+"/");
                                  HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                                  conn.setRequestMethod("GET"); conn.setConnectTimeout(15000); conn.setReadTimeout(15000);
                                  conn.setRequestProperty("User-Agent","GenshinAssistant/4.0 (Android)");
                                  int code=conn.getResponseCode();
                                  if(code!=200) throw new Exception("HTTP "+code);
                                  BufferedReader reader=new BufferedReader(new InputStreamReader(conn.getInputStream(),"UTF-8"));
                                  StringBuilder body=new StringBuilder(); String line;
                                  while((line=reader.readLine())!=null) body.append(line);
                                  reader.close(); conn.disconnect();
                                  JSONObject data=new JSONObject(body.toString());
                                  JSONObject player=data.optJSONObject("playerInfo");
                                  if(player==null) throw new Exception("لم يتم العثور على بيانات اللاعب.");
                                  JSONArray avatars=data.optJSONArray("avatarInfoList");
                                  int count=avatars==null?0:avatars.length();
                                  String nickname=player.optString("nickname","لا يوجد اسم");
                                  int world=player.optInt("worldLevel",-1);
                                  int achievements=player.optInt("finishAchievementNum",-1);
                                  runOnUiThread(()->{
                                      content.removeAllViews(); heading("تم الاتصال بالحساب!");
                                      line("UID: "+uid); line("اسم اللاعب: "+nickname);
                                      if(world>=0) line("مستوى العالم: "+world);
                                      if(achievements>=0) line("الإنجازات: "+achievements);
                                      line("الشخصيات الظاهرة في المعرض: "+count);
                                      if(count==0) line("لم تظهر شخصيات. فعّل Show Character Details في ملفك داخل اللعبة ثم أعد المحاولة.");
                                      else {
                                          line("معرّفات الشخصيات الظاهرة:");
                                          for(int i=0;i<count;i++) {
                                              JSONObject av=avatars.optJSONObject(i);
                                              if(av!=null) line("• "+av.optInt("avatarId",0));
                                          }
                                      }
                                      line("المصدر: Enka.Network — بيانات المعرض التي جعلتها عامة فقط.");
                                      Button back=new Button(this); back.setText("العودة للرئيسية"); back.setOnClickListener(v->showHome()); content.addView(back);
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(()->{

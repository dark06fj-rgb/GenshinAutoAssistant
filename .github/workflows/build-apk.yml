              String achievementKey(String name) {
                  return "achievement_done_"+Integer.toHexString(name.toLowerCase(Locale.ROOT).trim().hashCode());
              }
              boolean isAchievementPage(List<String> lines) {
                  for(String line:lines) {
                      String value=line.toLowerCase(Locale.ROOT).trim();
                      if(value.equals("achievements") || value.equals("achievement") || value.contains("achievement menu") || value.contains("الإنجازات")) return true;
                  }
                  return false;
              }
              boolean isCompletionStatus(String raw) {
                  String value=raw.toLowerCase(Locale.ROOT).trim();
                  return value.matches("^(achievement\\s+)?(completed|obtained|claimed|unlocked)(\\b.*)$")
                      || value.matches("^date\\s+completed\\b.*$")
                      || value.contains("achievement completed") || value.contains("تم الحصول")
                      || value.contains("مكتمل") || value.contains("مكتملة") || value.contains("تم فتح")
                      || value.contains("تم الإنجاز");
              }
              void markCompletedFromOcr(List<String> lines) {
                  for(int i=0;i<lines.size();i++) {
                      if(!isCompletionStatus(lines.get(i))) continue;
                      for(int j=i-1;j>=0;j--) {
                          String candidate=lines.get(j).trim();
                          String lower=candidate.toLowerCase(Locale.ROOT);
                          if(candidate.length()>=4 && !lower.equals("achievements") && !lower.equals("achievement")
                              && !lower.matches(".*(completed|obtained|claimed|unlocked|date completed).*")) {
                              prefs.edit().putBoolean(achievementKey(candidate),true).apply();
                              try {
                                  JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                                  boolean exists=false;
                                  for(int k=0;k<old.length();k++) if(old.optString(k).equalsIgnoreCase(candidate)) exists=true;
                                  if(!exists){old.put(candidate);prefs.edit().putString("achievement_lines",old.toString()).apply();}
                              } catch(Exception ignored) {}
                              break;
                          }
                      }
                  }
              }

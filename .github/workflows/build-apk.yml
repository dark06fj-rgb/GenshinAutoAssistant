                  int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                  floatingMenuParams=new WindowManager.LayoutParams(dp(220),-2,type,

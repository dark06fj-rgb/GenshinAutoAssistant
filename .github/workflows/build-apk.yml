
name: Build Genshin Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/genshinassistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GenshinAssistant"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.genshinassistant'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.genshinassistant'
                  minSdk 23
                  targetSdk 33
                  versionCode 9
                  versionName '5.5'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <queries>
                  <package android:name="com.miHoYo.GenshinImpact"/>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="Genshin Assistant"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/genshinassistant/MainActivity.java <<'EOF'
          package com.example.genshinassistant;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.*;
          import android.content.SharedPreferences;
          import java.util.*;
          import java.net.*;
          import java.io.*;
          import org.json.*;
          import android.content.Intent;
          import android.net.Uri;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.hardware.display.VirtualDisplay;
          import android.hardware.display.DisplayManager;
          import android.media.Image;
          import android.media.ImageReader;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import android.provider.Settings;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import com.google.mlkit.nl.translate.Translation;
          import com.google.mlkit.nl.translate.Translator;
          import com.google.mlkit.nl.translate.TranslatorOptions;
          import com.google.mlkit.nl.translate.TranslateLanguage;
          import com.google.mlkit.common.model.DownloadConditions;
          import android.os.Handler;
          import android.os.Looper;
          import java.util.concurrent.atomic.AtomicBoolean;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          
          public class MainActivity extends Activity {
              static final int PICK_ACHIEVEMENT_IMAGE=501;
              static final int REQUEST_SCREEN_CAPTURE=502;
              MediaProjection mediaProjection;
              VirtualDisplay virtualDisplay;
              WindowManager overlayManager;
              TextView overlayText;
              LinearLayout floatingMenu, floatingMenuItems;
              WindowManager.LayoutParams floatingMenuParams;
              boolean resourceMarkersEnabled=true, translationVisible=true;
              Translator liveTranslator;
              boolean translatorReady=false;
              final AtomicBoolean translatingText=new AtomicBoolean(false);
              long lastTranslationAt=0;
              String lastLiveSource="";
              ImageReader imageReader;
              TextRecognizer liveRecognizer;
              final AtomicBoolean processingFrame=new AtomicBoolean(false);
              final LinkedHashSet<String> liveNames=new LinkedHashSet<>();
              final LinkedHashMap<String,TextView> resourceMarkers=new LinkedHashMap<>();
              LinearLayout root, content, nav;
              SharedPreferences prefs;
              final String[] characters = {"Aino","Albedo","Alhaitham","Amber","Arlecchino","Barbara","Bennett","Chasca","Furina","Ganyu","Hu Tao","Kaedehara Kazuha","Kamisato Ayaka","Kamisato Ayato","Keqing","Klee","Nahida","Neuvillette","Raiden Shogun","Xiangling","Xingqiu","Yelan","Zhongli"};
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs=getSharedPreferences("genshin_progress",MODE_PRIVATE);
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16,18,16,12); root.setBackgroundColor(Color.rgb(247,246,250));
                  TextView title=new TextView(this); title.setText("Genshin Assistant"); title.setTextSize(25);
                  title.setTypeface(null,Typeface.BOLD); title.setTextColor(Color.rgb(65,48,91));
                  title.setGravity(Gravity.CENTER); title.setPadding(4,8,4,14); root.addView(title);
                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(2,4,2,18); scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  nav=new LinearLayout(this); nav.setOrientation(LinearLayout.HORIZONTAL); nav.setGravity(Gravity.CENTER);
                  addNav("الرئيسية",()->showHome()); addNav("الشخصيات",()->showCharacters()); addNav("المهام",()->showTasks()); addNav("الإنجازات",()->showAchievements());
                  root.addView(nav); setContentView(root); showHome();
              }
              void addNav(String label,Runnable action) {
                  Button b=new Button(this); b.setText(label); b.setTextSize(12); b.setOnClickListener(v->action.run());
                  nav.addView(b,new LinearLayout.LayoutParams(0,-2,1));
              }
              void heading(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(21); t.setTypeface(null,Typeface.BOLD);
                  t.setTextColor(Color.rgb(65,48,91)); t.setPadding(4,12,4,10); content.addView(t);
              }
              void line(String value) {
                  TextView t=new TextView(this); t.setText(value); t.setTextSize(15); t.setTextColor(Color.DKGRAY);
                  t.setPadding(4,5,4,8); content.addView(t);
              }
              void check(String key,String label) {
                  CheckBox c=new CheckBox(this); c.setText(label); c.setTextSize(15); c.setPadding(4,5,4,5);
                  c.setChecked(prefs.getBoolean(key,false));
                  c.setOnCheckedChangeListener((v,checked)->prefs.edit().putBoolean(key,checked).apply());
                  content.addView(c);
              }
              String key(String prefix,String name) {
                  return prefix+"_"+name.toLowerCase(Locale.ROOT).replace(" ","_");
              }
              int dp(float value) { return (int)(value*getResources().getDisplayMetrics().density+0.5f); }
              class GenshinFrame extends android.view.View {
                  final android.graphics.Paint paint=new android.graphics.Paint(3);
                  GenshinFrame(android.content.Context context) { super(context); }
                  void star(android.graphics.Canvas canvas,float x,float y,float radius) {
                      android.graphics.Path path=new android.graphics.Path();
                      path.moveTo(x,y-radius); path.lineTo(x+radius*.25f,y-radius*.25f);
                      path.lineTo(x+radius,y); path.lineTo(x+radius*.25f,y+radius*.25f);                      path.lineTo(x,y+radius); path.lineTo(x-radius*.25f,y+radius*.25f);
                      path.lineTo(x-radius,y); path.lineTo(x-radius*.25f,y-radius*.25f); path.close();
                      paint.setColor(0xFFFFD98A); paint.setStyle(android.graphics.Paint.Style.FILL); canvas.drawPath(path,paint);
                  }
                  @Override protected void onDraw(android.graphics.Canvas canvas) {
                      super.onDraw(canvas);
                      float w=getWidth(),h=getHeight(); android.graphics.RectF r=new android.graphics.RectF(2,2,w-2,h-2);
                      paint.setShader(new android.graphics.LinearGradient(0,0,w,h,new int[]{0xFF101B3A,0xFF38245F,0xFF172B50},null,android.graphics.Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(r,dp(18),dp(18),paint); paint.setShader(null);
                      paint.setStyle(android.graphics.Paint.Style.STROKE); paint.setStrokeWidth(dp(2)); paint.setColor(0xFFE7C47B);
                      canvas.drawRoundRect(new android.graphics.RectF(dp(5),dp(5),w-dp(5),h-dp(5)),dp(15),dp(15),paint);
                      paint.setStrokeWidth(dp(1)); paint.setColor(0x887FC9F4);
                      canvas.drawRoundRect(new android.graphics.RectF(dp(10),dp(10),w-dp(10),h-dp(10)),dp(12),dp(12),paint);
                      paint.setStyle(android.graphics.Paint.Style.FILL);
                      star(canvas,dp(26),dp(25),dp(9)); star(canvas,w-dp(26),dp(25),dp(9));
                      star(canvas,dp(26),h-dp(25),dp(6)); star(canvas,w-dp(26),h-dp(25),dp(6));
                      paint.setTextAlign(android.graphics.Paint.Align.CENTER); paint.setTypeface(Typeface.create("serif",Typeface.BOLD));
                      paint.setColor(Color.WHITE); paint.setTextSize(dp(21)); canvas.drawText("GENSHIN IMPACT",w/2,h/2-dp(2),paint);
                      paint.setTypeface(Typeface.DEFAULT_BOLD); paint.setColor(0xFFFFD98A); paint.setTextSize(dp(13));
                      canvas.drawText("رحلتك في تيفات تبدأ هنا",w/2,h/2+dp(23),paint);
                      paint.setTextSize(dp(10)); paint.setColor(0xFFB9DDFB);
                      canvas.drawText("✦  GENSHIN ASSISTANT  ✦",w/2,h-dp(13),paint);
                  }
              }
              void showHome() {
                  content.removeAllViews();
                  content.addView(new GenshinFrame(this),new LinearLayout.LayoutParams(-1,dp(132)));
                  heading("أهلاً بك في رحلتك في تيفات!");
                  line("تابع شخصياتك ومواد التطوير والمهام من مكان واحد.");
                  int owned=0,done=0,total=0;
                  for(String n:characters) {
                      if(prefs.getBoolean(key("owned",n),false)) owned++;
                      for(int i=1;i<=5;i++){total++;if(prefs.getBoolean(key("task"+i,n),false))done++;}
                  }
                  line("الشخصيات التي تملكها: "+owned+" من "+characters.length);
                  line("مهام تطوير الشخصيات المنجزة: "+done+" من "+total);
                  ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(Math.max(1,total));bar.setProgress(done);content.addView(bar,new LinearLayout.LayoutParams(-1,24));
                  Button launch=new Button(this); launch.setText("▶ تشغيل Genshin Impact"); launch.setTextSize(17); launch.setOnClickListener(v->launchGenshin()); content.addView(launch,new LinearLayout.LayoutParams(-1,dp(54)));
                  Button b=new Button(this);b.setText("افتح قائمة الشخصيات");b.setOnClickListener(v->showCharacters());content.addView(b);
                  Button connect=new Button(this); connect.setText("ربط حساب Genshin عبر UID"); connect.setOnClickListener(v->connectAccount()); content.addView(connect);
                  line("يمكن جلب بيانات المعرض العام عبر UID دون كلمة مرور أو ملفات اللعبة.");
                  Button achievements=new Button(this); achievements.setText("سجل الإنجازات"); achievements.setOnClickListener(v->showAchievements()); content.addView(achievements);
              }
              void launchGenshin() {
                  final String packageName="com.miHoYo.GenshinImpact";
                  try {
                      Intent launchIntent=getPackageManager().getLaunchIntentForPackage(packageName);
                      if(launchIntent!=null) {
                          launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(launchIntent);
                      } else {
                          new android.app.AlertDialog.Builder(this)
                              .setTitle("اللعبة غير موجودة")
                              .setMessage("لم أجد Genshin Impact مثبتة على هذا الجهاز. هل تريد فتح صفحة اللعبة في Google Play؟")
                              .setNegativeButton("إلغاء",null)
                              .setPositiveButton("فتح المتجر",(dialog,which)->{
                                  try { startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("market://details?id="+packageName))); }
                                  catch(Exception e) { startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://play.google.com/store/apps/details?id="+packageName))); }
                              }).show();
                      }
                  } catch(Exception e) {
                      Toast.makeText(this,"تعذر فتح اللعبة: "+e.getMessage(),Toast.LENGTH_LONG).show();
                  }
              }
              void connectAccount() {
                  LinearLayout form=new LinearLayout(this); form.setOrientation(LinearLayout.VERTICAL);
                  EditText uidInput=new EditText(this); uidInput.setSingleLine(true); uidInput.setInputType(2);
                  uidInput.setHint("أدخل UID الخاص بك (9 أرقام)"); 
                  String saved=prefs.getString("game_uid","");
                  if(!saved.isEmpty()) uidInput.setText(saved);
                  form.addView(uidInput);
                  new android.app.AlertDialog.Builder(this).setTitle("ربط حساب Genshin")
                      .setMessage("يجب تفعيل Show Character Details في ملفك داخل اللعبة حتى يمكن قراءة شخصيات المعرض. لا تدخل كلمة المرور أو ملفات تعريف الارتباط.")
                      .setView(form)
                      .setNegativeButton("إلغاء",null)
                      .setPositiveButton("اتصال", (dialog,which)->{
                          String uid=uidInput.getText().toString().trim();
                          if(!uid.matches("\\d{9,11}")) { new android.app.AlertDialog.Builder(this).setMessage("UID غير صحيح. أدخل من 9 إلى 11 رقماً.").setPositiveButton("حسناً",null).show(); return; }
                          prefs.edit().putString("game_uid",uid).apply();
                          content.removeAllViews(); heading("جارٍ الاتصال...");
                          line("نقرأ بيانات المعرض العام فقط. قد يستغرق ذلك بضع ثوانٍ.");
                          new Thread(()->{
                              try {
                                  URL url=new URL("https://enka.network/api/uid/"+uid+"/");
                                  HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                                  conn.setRequestMethod("GET"); conn.setConnectTimeout(15000); conn.setReadTimeout(15000);
                                  conn.setRequestProperty("User-Agent","GenshinAssistant/4.0 (Android)");
                                  int code=conn.getResponseCode();
                                  if(code!=200) throw new Exception("HTTP "+code);
                                  BufferedReader reader=new BufferedReader(new InputStreamReader(conn.getInputStream(),"UTF-8"));
                                  StringBuilder body=new StringBuilder(); String line;
                                  while((line=reader.readLine())!=null) body.append(line);
                                  reader.close(); conn.disconnect();
                                  JSONObject data=new JSONObject(body.toString());
                                  JSONObject player=data.optJSONObject("playerInfo");
                                  if(player==null) throw new Exception("لم يتم العثور على بيانات اللاعب.");
                                  JSONArray avatars=data.optJSONArray("avatarInfoList");
                                  int count=avatars==null?0:avatars.length();
                                  String nickname=player.optString("nickname","لا يوجد اسم");
                                  int world=player.optInt("worldLevel",-1);
                                  int achievements=player.optInt("finishAchievementNum",-1);
                                  runOnUiThread(()->{
                                      content.removeAllViews(); heading("تم الاتصال بالحساب!");
                                      line("UID: "+uid); line("اسم اللاعب: "+nickname);
                                      if(world>=0) line("مستوى العالم: "+world);
                                      if(achievements>=0) line("الإنجازات: "+achievements);
                                      line("الشخصيات الظاهرة في المعرض: "+count);
                                      if(count==0) line("لم تظهر شخصيات. فعّل Show Character Details في ملفك داخل اللعبة ثم أعد المحاولة.");
                                      else {
                                          line("معرّفات الشخصيات الظاهرة:");
                                          for(int i=0;i<count;i++) {
                                              JSONObject av=avatars.optJSONObject(i);
                                              if(av!=null) line("• "+av.optInt("avatarId",0));
                                          }
                                      }
                                      line("المصدر: Enka.Network — بيانات المعرض التي جعلتها عامة فقط.");
                                      Button back=new Button(this); back.setText("العودة للرئيسية"); back.setOnClickListener(v->showHome()); content.addView(back);
                                  });
                              } catch(Exception e) {
                                  runOnUiThread(()->{
                                      content.removeAllViews(); heading("تعذر الاتصال");
                                      line("تحقق من UID واتصال الإنترنت وإعدادات عرض الشخصيات في اللعبة.");
                                      line("تفاصيل الخطأ: "+e.getMessage());
                                      Button retry=new Button(this); retry.setText("إعادة المحاولة"); retry.setOnClickListener(v->connectAccount()); content.addView(retry);
                                      Button back=new Button(this); back.setText("الرئيسية"); back.setOnClickListener(v->showHome()); content.addView(back);
                                  });
                              }
                          }).start();
                      }).show();
              }
              void showCharacters() {
                  content.removeAllViews();heading("قائمة الشخصيات");
                  line("ضع علامة على الشخصيات التي تملكها، واضغط على اسمها لمتابعة تطويرها.");
                  EditText search=new EditText(this);search.setSingleLine(true);search.setTextSize(15);
                  search.setHint("ابحث عن شخصية...");content.addView(search);
                  LinearLayout list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);content.addView(list);
                  Runnable refresh=()->{
                      list.removeAllViews();String q=search.getText().toString().toLowerCase(Locale.ROOT).trim();
                      for(String name:characters){
                          if(!name.toLowerCase(Locale.ROOT).contains(q))continue;
                          LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);
                          CheckBox owned=new CheckBox(this);owned.setText("أملكها");owned.setTextSize(12);
                          owned.setChecked(prefs.getBoolean(key("owned",name),false));
                          owned.setOnCheckedChangeListener((v,checked)->prefs.edit().putBoolean(key("owned",name),checked).apply());
                          row.addView(owned);
                          Button details=new Button(this);details.setText(name);details.setAllCaps(false);
                          details.setOnClickListener(v->showCharacterDetails(name));
                          row.addView(details,new LinearLayout.LayoutParams(0,-2,1));list.addView(row);
                      }
                  };
                  search.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int before,int count){refresh.run();}
                      public void afterTextChanged(Editable e){}
                  });refresh.run();
              }
              void showCharacterDetails(String name) {
                  content.removeAllViews();Button back=new Button(this);back.setText("رجوع إلى الشخصيات");
                  back.setOnClickListener(v->showCharacters());content.addView(back);heading(name);
                  line("علّم على ما أنجزته؛ سيُحفظ التقدم تلقائياً.");
                  check(key("task1",name),"رفع المستوى");check(key("task2",name),"جمع مواد الصعود");
                  check(key("task3",name),"تطوير المواهب");check(key("task4",name),"تحسين القطع الأثرية");
                  check(key("task5",name),"تطوير السلاح");
                  int done=0;for(int i=1;i<=5;i++)if(prefs.getBoolean(key("task"+i,name),false))done++;
                  line("إنجاز تطوير الشخصية: "+(done*20)+"٪");
                  ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(5);bar.setProgress(done);content.addView(bar,new LinearLayout.LayoutParams(-1,24));
              }
          void showAchievements() {
                  content.removeAllViews(); heading("سجل الإنجازات");
                  line("يمكنك قراءة النصوص الظاهرة في اللعبة مباشرةً دون التقاط صور يدوياً. ابدأ المسح ووافق على مشاركة الشاشة، ثم انتقل إلى صفحات الإنجازات ومرّر بينها.");
                  Button live=new Button(this); live.setText("بدء المسح المباشر من الشاشة"); live.setOnClickListener(v->startLiveScan()); content.addView(live);
                  Button stop=new Button(this); stop.setText("إيقاف المسح وعرض النتائج"); stop.setOnClickListener(v->stopLiveScan()); content.addView(stop);
                  line("لا تُحفظ لقطات الشاشة؛ تُحلّل الإطارات مؤقتاً على الجهاز. قد تمنع اللعبة التقاط الشاشة، ويجب مراجعة النتائج يدوياً.");
                  Button pick=new Button(this); pick.setText("استيراد صورة (اختياري)"); pick.setOnClickListener(v->{
                      Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.setType("image/*"); intent.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(intent,PICK_ACHIEVEMENT_IMAGE);
                  }); content.addView(pick);
                  showAchievementList();
              }
              String achievementKey(String name) {
                  return "achievement_done_"+Integer.toHexString(name.toLowerCase(Locale.ROOT).trim().hashCode());
              }
              void markCompletedFromOcr(List<String> lines) {
                  for(int i=0;i<lines.size();i++) {
                      String status=lines.get(i).toLowerCase(Locale.ROOT).trim();
                      boolean completed=status.matches("^(achievement\\s+)?(completed|obtained|claimed|unlocked)(\\b.*)$")
                          || status.matches("^date\\s+completed\\b.*$");
                      if(!completed) continue;
                      for(int j=i-1;j>=0;j--) {
                          String candidate=lines.get(j).trim();
                          if(candidate.length()>=4 && !candidate.equalsIgnoreCase("Achievements")) {
                              prefs.edit().putBoolean(achievementKey(candidate),true).apply();
                              try {
                                  JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                                  boolean exists=false;
                                  for(int k=0;k<old.length();k++) if(old.optString(k).equalsIgnoreCase(candidate)) exists=true;
                                  if(!exists){old.put(candidate);prefs.edit().putString("achievement_lines",old.toString()).apply();}
                              } catch(Exception ignored) {}
                              break;
                          }
                      }
                  }
              }
              void setupTranslationOverlay() {
                  overlayManager=(WindowManager)getSystemService(WINDOW_SERVICE);
                  overlayText=new TextView(this);
                  overlayText.setText("Genshin Assistant\nجارٍ تجهيز الترجمة الإنجليزية ← العربية...");
                  overlayText.setTextColor(Color.WHITE); overlayText.setTextSize(15);
                  overlayText.setPadding(18,14,18,14); overlayText.setGravity(Gravity.CENTER_VERTICAL);
                  overlayText.setMaxLines(8);
                  GradientDrawable bg=new GradientDrawable();
                  bg.setColor(0xE6222430); bg.setCornerRadius(18);
                  bg.setStroke(2,0xFFB79AE8); overlayText.setBackground(bg);
                  int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                  WindowManager.LayoutParams params=new WindowManager.LayoutParams(
                      (int)(getResources().getDisplayMetrics().widthPixels*0.88),-2,type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT);
                  params.gravity=Gravity.TOP|Gravity.CENTER_HORIZONTAL; params.y=(int)(getResources().getDisplayMetrics().density*90);
                  try { overlayManager.addView(overlayText,params); } catch(Exception e) { Toast.makeText(this,"تعذر إظهار نافذة الترجمة. تحقق من إذن الظهور فوق التطبيقات.",Toast.LENGTH_LONG).show(); }
                  setupFloatingMenu();
                  TranslatorOptions options=new TranslatorOptions.Builder()
                      .setSourceLanguage(TranslateLanguage.ENGLISH)
                      .setTargetLanguage(TranslateLanguage.ARABIC).build();
                  liveTranslator=Translation.getClient(options);
                  liveTranslator.downloadModelIfNeeded(new DownloadConditions.Builder().build())
                      .addOnSuccessListener(v->{translatorReady=true;updateOverlay("الترجمة جاهزة\nافتح اللعبة لعرض الترجمة هنا.");})
                      .addOnFailureListener(e->updateOverlay("تعذر تنزيل نموذج الترجمة. اتصل بالإنترنت ثم أعد المحاولة."));              }
              void setupFloatingMenu() {
                  floatingMenu=new LinearLayout(this);
                  floatingMenu.setOrientation(LinearLayout.VERTICAL);
                  floatingMenu.setPadding(dp(8),dp(7),dp(8),dp(8));
                  GradientDrawable panel=new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      new int[]{0xF0182545,0xF02D2050,0xF0152940});
                  panel.setCornerRadius(dp(16));
                  panel.setStroke(dp(2),0xFFE7C47B);
                  floatingMenu.setBackground(panel);

                  LinearLayout header=new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title=new TextView(this);
                  title.setText("✦ قائمة تيفات ✦");
                  title.setTextColor(0xFFFFD98A);
                  title.setTextSize(15);
                  title.setTypeface(null,Typeface.BOLD);
                  title.setPadding(dp(5),dp(8),dp(5),dp(8));
                  header.addView(title,new LinearLayout.LayoutParams(0,-2,1));
                  TextView collapse=new TextView(this);
                  collapse.setText("−");
                  collapse.setTextColor(Color.WHITE);
                  collapse.setTextSize(22);
                  collapse.setGravity(Gravity.CENTER);
                  collapse.setPadding(dp(10),0,dp(10),0);
                  header.addView(collapse,new LinearLayout.LayoutParams(-2,dp(38)));
                  floatingMenu.addView(header);
                  floatingMenuItems=new LinearLayout(this);
                  floatingMenuItems.setOrientation(LinearLayout.VERTICAL);
                  floatingMenu.addView(floatingMenuItems);
                  addFloatingMenuItem("فتح المساعد",()->{
                      Intent intent=new Intent(this,MainActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT|Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      startActivity(intent);
                  });
                  addFloatingMenuItem("إظهار / إخفاء الترجمة",()->{
                      translationVisible=!translationVisible;
                      if(overlayText!=null) overlayText.setVisibility(translationVisible?android.view.View.VISIBLE:android.view.View.GONE);
                  });
                  addFloatingMenuItem("كاشف الموارد: تشغيل / إيقاف",()->{
                      resourceMarkersEnabled=!resourceMarkersEnabled;
                      if(!resourceMarkersEnabled) clearResourceMarkers();
                      Toast.makeText(this,resourceMarkersEnabled?"تم تشغيل علامات الموارد":"تم إيقاف علامات الموارد",Toast.LENGTH_SHORT).show();
                  });
                  addFloatingMenuItem("إيقاف المسح المباشر",()->stopLiveScan());
                  collapse.setOnClickListener(v->{
                      boolean expanded=floatingMenuItems.getVisibility()==android.view.View.VISIBLE;
                      floatingMenuItems.setVisibility(expanded?android.view.View.GONE:android.view.View.VISIBLE);
                      collapse.setText(expanded?"+":"−");
                  });

                  int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                  floatingMenuParams=new WindowManager.LayoutParams(dp(205),-2,type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL|WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT);
                  floatingMenuParams.gravity=Gravity.TOP|Gravity.RIGHT;
                  floatingMenuParams.x=dp(12);
                  floatingMenuParams.y=dp(205);
                  header.setOnTouchListener(new android.view.View.OnTouchListener(){
                      float downX,downY; int startX,startY;
                      @Override public boolean onTouch(android.view.View view,android.view.MotionEvent event) {
                          if(event.getAction()==android.view.MotionEvent.ACTION_DOWN) {
                              downX=event.getRawX(); downY=event.getRawY();
                              startX=floatingMenuParams.x; startY=floatingMenuParams.y;
                              return true;
                          }
                          if(event.getAction()==android.view.MotionEvent.ACTION_MOVE) {
                              floatingMenuParams.x=Math.max(0,startX+(int)(downX-event.getRawX()));
                              floatingMenuParams.y=Math.max(0,startY+(int)(event.getRawY()-downY));
                              try { overlayManager.updateViewLayout(floatingMenu,floatingMenuParams); } catch(Exception ignored) {}
                              return true;
                          }
                          return event.getAction()==android.view.MotionEvent.ACTION_UP;
                      }
                  });
                  try { overlayManager.addView(floatingMenu,floatingMenuParams); }
                  catch(Exception e) { Toast.makeText(this,"تعذر إظهار قائمة تيفات العائمة.",Toast.LENGTH_LONG).show(); }
              }
              void addFloatingMenuItem(String label,Runnable action) {
                  TextView item=new TextView(this);
                  item.setText("◆  "+label);
                  item.setTextColor(Color.WHITE);
                  item.setTextSize(13);
                  item.setPadding(dp(10),dp(10),dp(8),dp(10));
                  GradientDrawable bg=new GradientDrawable();
                  bg.setColor(0xCC354568);
                  bg.setCornerRadius(dp(10));
                  bg.setStroke(dp(1),0x887FC9F4);
                  item.setBackground(bg);
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);
                  lp.topMargin=dp(5);
                  floatingMenuItems.addView(item,lp);
                  item.setOnClickListener(v->action.run());
              }
              void clearResourceMarkers() {
                  if(overlayManager!=null) {
                      for(TextView marker:resourceMarkers.values()) {
                          try { overlayManager.removeView(marker); } catch(Exception ignored) {}
                      }
                  }
                  resourceMarkers.clear();
              }
              void translateLiveText(String source) {
                  long now=System.currentTimeMillis();
                  if(!translatorReady || liveTranslator==null || translatingText.get() || now-lastTranslationAt<1800 || source.equals(lastLiveSource)) return;
                  lastTranslationAt=now; lastLiveSource=source;
                  if(!translatingText.compareAndSet(false,true)) return;
                  liveTranslator.translate(source)
                      .addOnSuccessListener(translated->updateOverlay(source+"\n\nالعربية:\n"+translated))
                      .addOnFailureListener(e->updateOverlay("تعذرت ترجمة النص الظاهر.\n"+source))
                      .addOnCompleteListener(task->translatingText.set(false));
              }
              String detectedResource(String raw) {
                  String s=raw.toLowerCase(Locale.ROOT);
                  String[] resources={"sweet flower","mint","matsutake","sunsettia","berry","valberry","windwheel aster","cecilia","wolfhook","qingxin","silk flower","cor lapis","noctilucous jade","crystal chunk","white iron chunk","amethyst lump","iron chunk","scarab","onikabuto","sakura bloom","dandelion seed","lotus head","jueyun chili","philanemo mushroom","pinecone","bird egg","fowl","fish","crab","frog","lizard tail","common chest","exquisite chest","precious chest","luxurious chest","remarkable chest"};
                  for(String item:resources) if(s.contains(item)) return item;
                  return null;
              }
              void updateResourceMarkers(List<Text.Line> lines) {
                  if(overlayManager==null) return;
                  if(!resourceMarkersEnabled) { clearResourceMarkers(); return; }
                  HashSet<String> visible=new HashSet<>();
                  for(Text.Line line:lines) {
                      String item=detectedResource(line.getText());
                      Rect bounds=line.getBoundingBox();
                      if(item==null || bounds==null) continue;
                      visible.add(item);
                      TextView marker=resourceMarkers.get(item);
                      if(marker==null) {
                          marker=new TextView(this); marker.setText("◆ "+item);
                          marker.setTextColor(Color.WHITE); marker.setTextSize(12);
                          marker.setPadding(8,5,8,5);
                          GradientDrawable bg=new GradientDrawable(); bg.setColor(0xDD167A45); bg.setCornerRadius(12);
                          marker.setBackground(bg);
                          int type=Build.VERSION.SDK_INT>=26?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_PHONE;
                          WindowManager.LayoutParams p=new WindowManager.LayoutParams(-2,-2,type,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE|WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT);
                          p.gravity=Gravity.TOP|Gravity.LEFT;
                          p.x=Math.max(0,bounds.centerX()); p.y=Math.max(0,bounds.centerY());
                          try { overlayManager.addView(marker,p); resourceMarkers.put(item,marker); } catch(Exception ignored) {}
                      } else {
                          try {
                              WindowManager.LayoutParams p=(WindowManager.LayoutParams)marker.getLayoutParams();
                              p.x=Math.max(0,bounds.centerX()); p.y=Math.max(0,bounds.centerY());
                              overlayManager.updateViewLayout(marker,p);
                          } catch(Exception ignored) {}
                      }
                  }
                  Iterator<Map.Entry<String,TextView>> it=resourceMarkers.entrySet().iterator();
                  while(it.hasNext()) {
                      Map.Entry<String,TextView> entry=it.next();
                      if(!visible.contains(entry.getKey())) {
                          try { overlayManager.removeView(entry.getValue()); } catch(Exception ignored) {}
                          it.remove();
                      }
                  }
              }
              void updateOverlay(String value) {
                  runOnUiThread(()->{if(overlayText!=null) overlayText.setText(value);});
              }
              void showAchievementList() {
                  try {
                      JSONArray items=new JSONArray(prefs.getString("achievement_lines","[]"));
                      int done=0;
                      for(int i=0;i<items.length();i++) if(prefs.getBoolean(achievementKey(items.optString(i)),false)) done++;
                      line("العناصر التي تعرّف عليها التطبيق: "+items.length());
                      line("التي علّمتها كمكتملة: "+done+" من "+items.length());
                      ProgressBar progress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
                      progress.setMax(Math.max(1,items.length())); progress.setProgress(done);
                      content.addView(progress,new LinearLayout.LayoutParams(-1,24));
                      for(int i=0;i<items.length();i++) {
                          String name=items.optString(i);
                          CheckBox item=new CheckBox(this); item.setText(name); item.setTextSize(14);
                          item.setChecked(prefs.getBoolean(achievementKey(name),false));
                          item.setOnCheckedChangeListener((button,checked)->prefs.edit().putBoolean(achievementKey(name),checked).apply());
                          content.addView(item);
                      }
                      if(items.length()==0) line("لا توجد إنجازات مقروءة بعد. ابدأ المسح المباشر وانتقل إلى صفحات الإنجازات داخل اللعبة.");
                  } catch(Exception e) { line("تعذر عرض القائمة: "+e.getMessage()); }
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode==REQUEST_SCREEN_CAPTURE) { if(resultCode==RESULT_OK && data!=null) beginLiveScan(resultCode,data); else line("لم يتم منح إذن مشاركة الشاشة."); return; }
                  if(requestCode!=PICK_ACHIEVEMENT_IMAGE || resultCode!=RESULT_OK || data==null || data.getData()==null) return;
                  Uri uri=data.getData();
                  content.removeAllViews(); heading("قراءة الصورة...");
                  line("يجري استخراج النصوص من الصورة على جهازك.");
                  try {
                      InputImage image=InputImage.fromFilePath(this,uri);
                      TextRecognizer recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      recognizer.process(image)
                          .addOnSuccessListener(result->{
                              try {
                                  LinkedHashSet<String> names=new LinkedHashSet<>();
                                  JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                                  for(int i=0;i<old.length();i++) names.add(old.optString(i));
                                  for(Text.TextBlock block:result.getTextBlocks()) {
                                      for(Text.Line textLine:block.getLines()) {
                                          String value=textLine.getText().trim().replaceAll("\\s+"," ");
                                          boolean hasLetter=value.codePoints().anyMatch(Character::isLetter);
                                          if(value.length()>=3 && hasLetter) names.add(value);
                                      }
                                  }
                                  JSONArray merged=new JSONArray();
                                  for(String name:names) merged.put(name);
                                  prefs.edit().putString("achievement_lines",merged.toString()).apply();
                                  recognizer.close();
                                  content.removeAllViews(); heading("اكتملت قراءة الصورة");
                                  line("أضيفت النصوص المكتشفة. راجع القائمة وحدد الإنجازات المكتملة بنفسك؛ قد يلتقط OCR عناوين أو نصوصاً إضافية.");
                                  showAchievementList();
                              } catch(Exception e) {
                                  recognizer.close(); content.removeAllViews(); heading("تعذرت معالجة النص");
                                  line(e.getMessage());
                              }
                          })
                          .addOnFailureListener(error->{
                              recognizer.close(); content.removeAllViews(); heading("فشلت قراءة الصورة");
                              line("جرّب صورة أوضح، مع تكبير النص وتقليل الانعكاس.");
                              line(error.getMessage());
                          });
                  } catch(Exception e) {
                      content.removeAllViews(); heading("تعذر فتح الصورة"); line(e.getMessage());
                  }
              }
              void startLiveScan() {
                  if(Build.VERSION.SDK_INT>=23 && !Settings.canDrawOverlays(this)) {
                      new android.app.AlertDialog.Builder(this)
                          .setTitle("السماح بالنافذة العائمة")
                          .setMessage("لإظهار الترجمة العربية فوق اللعبة، اسمح للتطبيق بالظهور فوق التطبيقات الأخرى، ثم ارجع واضغط بدء المسح مرة أخرى.")
                          .setNegativeButton("لاحقاً",null)
                          .setPositiveButton("فتح الإعدادات",(d,w)->{
                              Intent settings=new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+getPackageName()));
                              startActivity(settings);
                          }).show();
                      return;
                  }
                  MediaProjectionManager manager=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(manager.createScreenCaptureIntent(),REQUEST_SCREEN_CAPTURE);
              }
              void beginLiveScan(int resultCode,Intent data) {
                  try {
                      MediaProjectionManager manager=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);
                      mediaProjection=manager.getMediaProjection(resultCode,data);
                      WindowManager wm=(WindowManager)getSystemService(WINDOW_SERVICE);
                      DisplayMetrics metrics=new DisplayMetrics(); wm.getDefaultDisplay().getRealMetrics(metrics);
                      int width=metrics.widthPixels,height=metrics.heightPixels,density=metrics.densityDpi;
                      imageReader=ImageReader.newInstance(width,height,PixelFormat.RGBA_8888,3);
                      liveRecognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      setupTranslationOverlay();
                      mediaProjection.registerCallback(new MediaProjection.Callback(){@Override public void onStop(){runOnUiThread(()->releaseCapture());}},new Handler(Looper.getMainLooper()));
                      virtualDisplay=mediaProjection.createVirtualDisplay("GenshinAchievementReader",width,height,density,DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,imageReader.getSurface(),null,null);
                      imageReader.setOnImageAvailableListener(reader->{
                          if(!processingFrame.compareAndSet(false,true)){Image skip=reader.acquireLatestImage();if(skip!=null)skip.close();return;}
                          Image frame=reader.acquireLatestImage();
                          if(frame==null){processingFrame.set(false);return;}
                          try {
                              InputImage input=InputImage.fromMediaImage(frame,0);
                              liveRecognizer.process(input).addOnSuccessListener(result->{
                                  LinkedHashSet<String> found=new LinkedHashSet<>();
                                  ArrayList<String> orderedLines=new ArrayList<>();
                                  StringBuilder screenText=new StringBuilder();
                                  ArrayList<Text.Line> detectedLines=new ArrayList<>();
                                  for(Text.TextBlock block:result.getTextBlocks()) for(Text.Line textLine:block.getLines()) {
                                      detectedLines.add(textLine);
                                      String value=textLine.getText().trim().replaceAll("\\s+"," ");
                                      if(value.length()>=3 && value.codePoints().anyMatch(Character::isLetter)) {
                                          found.add(value); orderedLines.add(value);
                                          if(screenText.length()<650) screenText.append(value).append('\n');
                                      }
                                  }
                                  saveLiveNames(found);
                                  markCompletedFromOcr(orderedLines);
                                  updateResourceMarkers(detectedLines);
                                  if(screenText.length()>0) translateLiveText(screenText.toString().trim());
                              }).addOnCompleteListener(task->{frame.close();processingFrame.set(false);});
                          } catch(Exception e){frame.close();processingFrame.set(false);}
                      },new Handler(Looper.getMainLooper()));
                      Toast.makeText(this,"بدأ المسح. انتقل إلى اللعبة ومرّر صفحات الإنجازات.",Toast.LENGTH_LONG).show();
                  } catch(Exception e){line("تعذر بدء المسح: "+e.getMessage());releaseCapture();}
              }
              void saveLiveNames(Set<String> found) {
                  try {
                      LinkedHashSet<String> merged=new LinkedHashSet<>();
                      JSONArray old=new JSONArray(prefs.getString("achievement_lines","[]"));
                      for(int i=0;i<old.length();i++)merged.add(old.optString(i));
                      merged.addAll(found);
                      JSONArray arr=new JSONArray();for(String s:merged)arr.put(s);
                      prefs.edit().putString("achievement_lines",arr.toString()).apply();
                  }catch(Exception ignored){}
              }
              void stopLiveScan() {
                  if(mediaProjection!=null){try{mediaProjection.stop();}catch(Exception ignored){}}
                  releaseCapture();content.removeAllViews();heading("نتائج المسح المباشر");showAchievementList();
              }
              void releaseCapture() {
                  if(virtualDisplay!=null){virtualDisplay.release();virtualDisplay=null;}
                  if(imageReader!=null){imageReader.close();imageReader=null;}
                  if(liveRecognizer!=null){liveRecognizer.close();liveRecognizer=null;}
                  if(liveTranslator!=null){liveTranslator.close();liveTranslator=null;}
                  translatorReady=false; translatingText.set(false);
                  if(overlayText!=null && overlayManager!=null){try{overlayManager.removeView(overlayText);}catch(Exception ignored){}}
                  overlayText=null;
                  if(floatingMenu!=null && overlayManager!=null) { try { overlayManager.removeView(floatingMenu); } catch(Exception ignored) {} }
                  floatingMenu=null; floatingMenuItems=null; floatingMenuParams=null;
                  if(overlayManager!=null) {
                      for(TextView marker:resourceMarkers.values()) { try { overlayManager.removeView(marker); } catch(Exception ignored) {} }
                  }
                  resourceMarkers.clear(); overlayManager=null;
                  mediaProjection=null;
              }
              @Override protected void onDestroy(){if(mediaProjection!=null){try{mediaProjection.stop();}catch(Exception ignored){}}releaseCapture();super.onDestroy();}
              void showTasks() {
                  content.removeAllViews();heading("المهام العامة");
                  line("مهام يمكنك التأشير عليها بعد إنجازها.");
                  check("daily_commissions","إنجاز المهام اليومية");check("daily_resin","استخدام الراتنج الأصلي");
                  check("weekly_boss","إنجاز زعماء الأسبوع");check("domains","إنجاز الزنزانات");
                  check("exploration","استكشاف المناطق");check("waypoints","فتح نقاط الانتقال");
                  check("local_specialties","جمع الموارد المحلية");check("enemy_drops","جمع مواد الوحوش");
                  line("تبقى العلامات محفوظة حتى تغيّرها بنفسك.");
              }
          }

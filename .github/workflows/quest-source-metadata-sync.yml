name: Sync quest source metadata by ID

on:
  push:
    paths:
      - ".github/workflows/quest-source-metadata-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-quest-source-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4
        with:
          ref: arabic-localization-catalog
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve only requested quest IDs
        run: python scripts/sync_quest_source_metadata.py
      - name: Extract English descriptions for retained legacy WQ backlog
        run: python scripts/extract_legacy_world_quest_descriptions.py
      - name: Upload legacy WQ source descriptions
        uses: actions/upload-artifact@v4
        with:
          name: legacy-world-quest-source-descriptions-en
          path: |
            artifacts/world_quest_source_descriptions_en.json
            artifacts/world_quest_source_description_report.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit metadata when changed
        run: |
          if git diff --quiet -- localization/ar/quests_archon.json localization/ar/quests_world.json; then
            echo "Quest source metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/ar/quests_archon.json localization/ar/quests_world.json
          git commit -m "Resolve quest source text hashes by ID"
          git push origin HEAD:arabic-localization-catalog

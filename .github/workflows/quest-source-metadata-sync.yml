name: Sync quest source metadata by ID

on:
  push:
    paths:
      - "scripts/sync_quest_source_metadata.py"
      - ".github/workflows/quest-source-metadata-sync.yml"
      - "localization/ar/quests_archon.json"
      - "localization/ar/quests_world.json"
      - "localization/quest-title-translations.json"
  workflow_dispatch:

concurrency:
  group: quest-source-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-quest-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4
        with:
          ref: arabic-localization-catalog
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Expand and resolve the complete AQ/WQ source roster
        run: python scripts/sync_quest_source_metadata.py
      - name: Run localization regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate expanded quest catalogs
        run: python scripts/validate_localization.py
      - name: Commit metadata when changed
        run: |
          if git diff --quiet -- localization/ar/quests_archon.json localization/ar/quests_world.json localization/quest-import-report.json; then
            echo "Quest source metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/ar/quests_archon.json localization/ar/quests_world.json localization/quest-import-report.json localization/quest-title-translations.json
          git commit -m "Import complete AQ/WQ source roster and metadata"
          git push origin HEAD:arabic-localization-catalog

name: Localization catalog validation

on:
  push:
    paths:
      - "localization/**/*.json"
      - "artifacts/world_quest_source_descriptions_en.json"
      - "scripts/validate_localization.py"
      - "scripts/translate_quest_summaries.py"
      - "scripts/sync_quest_source_metadata.py"
      - "tests/**"
      - ".github/workflows/localization-validation.yml"
  pull_request:
    paths:
      - "localization/**/*.json"
      - "artifacts/world_quest_source_descriptions_en.json"
      - "scripts/validate_localization.py"
      - "scripts/translate_quest_summaries.py"
      - "tests/**"
      - ".github/workflows/localization-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate localization
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run localization regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalog files
        run: python scripts/validate_localization.py

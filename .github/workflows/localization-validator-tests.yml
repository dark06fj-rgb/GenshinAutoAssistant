name: Localization validator tests

on:
  push:
    branches: [arabic-localization-catalog]
    paths:
      - "scripts/validate_localization.py"
      - "scripts/sync_quest_source_metadata.py"
      - "tests/**"
      - "localization/ar/**"
      - ".github/workflows/localization-validator-tests.yml"
  pull_request:
    branches: [arabic-localization-catalog]
    paths:
      - "scripts/validate_localization.py"
      - "tests/**"
      - "localization/ar/**"
      - ".github/workflows/localization-validator-tests.yml"

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate current localization catalogs
        run: python scripts/validate_localization.py

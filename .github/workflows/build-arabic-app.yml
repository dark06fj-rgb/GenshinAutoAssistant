name: Build Teyvat Arabic APK

on:
  workflow_dispatch:
  push:
    branches:
      - arabic-localization-catalog
    paths:
      - 'arabic-app/**'
      - 'localization/ar/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-arabic-app.yml'

permissions:
  contents: read

concurrency:
  group: teyvat-arabic-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standalone Arabic APK
        run: gradle :arabic-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teyvat-arabic-debug-apk
          path: arabic-app/build/outputs/apk/debug/arabic-app-debug.apk
          if-no-files-found: error

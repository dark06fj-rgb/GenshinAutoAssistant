name: Draft Arabic quest summaries with DeepSeek

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: quest-summary-drafts-gemini-arabic-work
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out the protected work branch
        uses: actions/checkout@v4
        with:
          ref: gemini-arabic-work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Explain missing API secret
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::warning::DEEPSEEK_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions."
          echo "The translation step will be skipped."

      - name: Draft up to 15 source-backed Arabic summaries
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          MAX_TRANSLATIONS_PER_RUN: "15"
          DEEPSEEK_MODEL: deepseek-chat
        run: python scripts/translate_quest_summaries.py

      - name: Validate localization catalog
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: python scripts/validate_localization.py

      - name: Commit draft catalog updates
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          if git diff --quiet -- localization/ar/quests_archon.json localization/ar/quests_world.json; then
            echo "No source-backed summaries were available to translate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/ar/quests_archon.json localization/ar/quests_world.json
          git commit -m "Add DeepSeek Arabic quest summary drafts"
          git push origin HEAD:gemini-arabic-work

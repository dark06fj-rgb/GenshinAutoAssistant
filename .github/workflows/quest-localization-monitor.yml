name: Monitor Arabic quest localization

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: arabic-quest-localization-monitor
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the localization work branch
        uses: actions/checkout@v4
        with:
          ref: gemini-arabic-work
          fetch-depth: 1

      - name: Summarize Archon and World Quest translation progress
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          catalogs = [
              ("مهام القصة الرئيسية (Archon)", Path("localization/ar/quests_archon.json")),
              ("مهام العالم (World)", Path("localization/ar/quests_world.json")),
          ]
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          message = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"], text=True
          ).strip()

          lines = [
              "# تقرير متابعة التعريب",
              "",
              f"- الفرع: `gemini-arabic-work`",
              f"- أحدث commit: `{commit}`",
              f"- الرسالة: {message}",
              "",
          ]
          errors = []

          for label, path in catalogs:
              lines.append(f"## {label}")
              if not path.exists():
                  lines.append("- الحالة: الملف غير موجود")
                  errors.append(f"{path}: missing")
                  lines.append("")
                  continue
              try:
                  raw = path.read_text(encoding="utf-8")
                  if not raw.strip():
                      raise ValueError("الملف فارغ")
                  data = json.loads(raw)
                  entries = data.get("entries")
                  if not isinstance(entries, list):
                      raise ValueError("الحقل entries ليس قائمة")
              except Exception as exc:
                  lines.append(f"- الحالة: تعذر قراءة الكتالوج — {exc}")
                  errors.append(f"{path}: {exc}")
                  lines.append("")
                  continue

              total = len(entries)
              filled = sum(
                  isinstance(item, dict)
                  and isinstance(item.get("description_ar"), str)
                  and bool(item["description_ar"].strip())
                  for item in entries
              )
              by_status = {}
              for item in entries:
                  if isinstance(item, dict):
                      status = str(item.get("translation_status", "غير محدد"))
                      by_status[status] = by_status.get(status, 0) + 1
              lines.extend([
                  f"- إجمالي السجلات: **{total}**",
                  f"- الملخصات العربية المكتملة: **{filled}**",
                  f"- الملخصات التي ما زالت فارغة/ناقصة: **{total - filled}**",
                  "- حالات الترجمة: " + (
                      ", ".join(f"{key}: {value}" for key, value in sorted(by_status.items()))
                      if by_status else "لا توجد"
                  ),
                  "",
              ])

          lines.extend([
              "## نتيجة الفحص",
              "- لم يُجرِ هذا الفحص أي تعديل على ملفات المستودع.",
              "- هذا التقرير يقيس وجود الملخص العربي وحالة السجلات، ولا يعتبر المسودات مراجعة بشرية أو اعتماداً نهائياً.",
          ])
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print(summary)
          PY
